<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Floor Plan</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink:#14171c;
    --paper:#ffffff;
    --wall:#20242c;
    --accent:#ff5a1f;
    --accent-ink:#ffffff;
    --window:#0e6fc4;
    --door:#8a5a2b;
    --line:#d8d3c4;
    --panel:#f6f4ee;
    --muted:#4b5058;
    --danger:#c62828;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--paper);
    display:flex; flex-direction:column; height:100%;
    -webkit-user-select:none; user-select:none;
  }
  input,textarea,[contenteditable]{-webkit-user-select:text; user-select:text;}
  button{font-family:inherit;}

  /* ---------- Header ---------- */
  header{flex:0 0 auto; border-bottom:2px solid var(--ink); background:var(--paper);}
  #titleRow{display:flex; align-items:center; gap:10px; padding:9px 12px 4px;}
  #title{
    font-size:17px; font-weight:800; letter-spacing:-0.01em;
    flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    padding:5px 7px; border-radius:8px;
  }
  #title:focus{outline:2px solid var(--accent); background:var(--panel); white-space:normal; overflow:visible; text-overflow:clip;}
  #saveIndicator{font-size:11px; font-weight:700; color:var(--muted); flex:0 0 auto; min-width:44px; text-align:right;}
  #undoBtn{
    flex:0 0 auto; font-size:12px; font-weight:800; color:var(--accent-ink); background:var(--accent);
    border:2px solid var(--accent); border-radius:8px; padding:5px 9px;
  }
  #undoBtn:disabled{opacity:0.35;}
  #planAddressFloat{
    position:absolute; top:8px; left:10px; z-index:5; cursor:pointer;
    font-size:12.5px; font-weight:700; color:#9a9488; background:rgba(255,255,255,0.82);
    padding:3px 9px; border-radius:999px; display:none; max-width:70%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #planAddressFloat.show{display:block;}
  #zoomControls{
    position:absolute; bottom:10px; right:10px; z-index:5;
    display:flex; flex-direction:column; gap:6px;
  }
  #zoomControls button{
    width:38px; height:38px; border-radius:999px; border:2px solid var(--ink);
    background:rgba(255,255,255,0.92); color:var(--ink); font-size:18px; font-weight:800;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  #zoomFitBtn{font-size:15px;}
  #scheduleAddress{
    padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;
    border-bottom:1px solid var(--line); background:var(--panel); display:none;
  }
  #scheduleAddress.show{display:block;}

  #levelBar{display:flex; align-items:center; gap:6px; padding:0 10px 8px;}
  #levelSelect{
    flex:1; min-width:0; font-size:13.5px; font-weight:700; color:var(--ink);
    padding:6px 6px; border:2px solid var(--ink); border-radius:8px; background:var(--paper);
  }
  #levelBar button{
    font-size:12px; font-weight:800; color:var(--ink); background:var(--paper);
    border:2px solid var(--ink); border-radius:8px; padding:6px 9px; white-space:nowrap;
  }

  /* ---------- Tabs ---------- */
  #tabs{flex:0 0 auto; display:flex; border-bottom:2px solid var(--ink); background:var(--panel);}
  .tab{flex:1; text-align:center; padding:12px 8px; font-size:15px; font-weight:800; color:var(--muted); border-right:1px solid var(--line);}
  .tab:last-child{border-right:none;}
  .tab.active{color:var(--ink); background:var(--paper); box-shadow: inset 0 -3px 0 var(--accent);}

  /* ---------- Main views ---------- */
  #views{flex:1 1 auto; min-height:0; position:relative;}
  .view{position:absolute; inset:0; display:none; flex-direction:column; min-height:0;}
  .view.active{display:flex;}

  /* ---------- Plan view ---------- */
  #canvasWrap{flex:1 1 auto; min-height:0; background:var(--paper); position:relative; overflow:hidden;}
  #planSvg{width:100%; height:100%; display:block; touch-action:none;}

  #toolbar{
    flex:0 0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
    padding:8px; background:var(--panel); border-top:2px solid var(--ink);
  }
  .tbtn{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:var(--paper); border:2px solid var(--ink); border-radius:10px;
    padding:8px 2px; font-size:10.5px; font-weight:800; color:var(--ink);
    min-height:56px;
  }
  .tbtn svg{width:20px; height:20px;}
  .tbtn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tbtnBadge{
    position:absolute; top:-6px; right:-6px; background:var(--window); color:#fff;
    font-size:9px; font-weight:800; padding:2px 5px; border-radius:999px;
    border:2px solid var(--paper); letter-spacing:0.02em;
  }

  /* ---------- Inline editor panel ---------- */
  #inlinePanel{
    flex:0 0 auto; display:none; flex-direction:column; max-height:34vh;
    border-top:2px solid var(--ink); background:var(--paper);
    padding-bottom:calc(0px + env(safe-area-inset-bottom));
  }
  #inlinePanel.show{display:flex;}
  #inlinePanelHeader{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--ink); color:#fff; flex:0 0 auto;
  }
  #inlinePanelTitle{font-weight:800; font-size:14.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #inlinePanelClose{background:rgba(255,255,255,0.2); color:#fff; border:none; border-radius:999px; width:26px; height:26px; font-weight:800;}
  #inlinePanelBody{flex:1 1 auto; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px;}
  .ipRow label{display:block; font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:3px;}
  .ipRow input, .ipRow select{width:100%; font-size:15px; padding:9px 10px; border:2px solid var(--line); border-radius:8px; color:var(--ink); background:var(--paper);}
  .ipRow select{-webkit-appearance:none; appearance:none; height:44px;}
  .ipRow input:focus, .ipRow select:focus{outline:none; border-color:var(--accent);}
  .ipRow input:disabled, .ipRow select:disabled{background:var(--panel); color:var(--muted);}
  .ipSeg{display:flex; gap:6px;}
  .ipSegBtn{flex:1; font-size:12px; font-weight:800; padding:9px 4px; border:2px solid var(--ink); border-radius:8px; background:var(--paper); color:var(--ink);}
  .ipSegBtn.active{background:var(--window); border-color:var(--window); color:#fff;}
  .ipSegBtn:disabled{opacity:0.4;}
  .ipActionsRow{display:flex; gap:8px; margin-top:6px;}
  .ipPhotoWrap{display:flex; align-items:center; gap:8px;}
  .ipPhotoThumb{width:52px; height:52px; object-fit:cover; border-radius:8px; border:2px solid var(--line);}
  .ipActionBtn{flex:1; border:2px solid var(--ink); border-radius:10px; padding:11px; font-weight:800; font-size:14px; background:var(--paper); color:var(--ink);}
  .ipActionBtn.active{background:var(--muted); border-color:var(--muted); color:#fff;}
  .ipDangerBtn{background:var(--danger); color:#fff; border-color:var(--danger);}

  /* ---------- Schedule view ---------- */
  #scheduleWrap{flex:1 1 auto; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch;}
  table#sched{border-collapse:collapse; width:100%; font-size:14px;}
  #sched th, #sched td{border:1px solid var(--line); padding:9px 10px; text-align:left; min-width:110px; vertical-align:top;}
  #sched thead th{background:var(--ink); color:#fff; font-weight:800; position:sticky; top:0; z-index:2;}
  #sched thead th[contenteditable]:focus{background:var(--accent); outline:none;}
  #sched td[contenteditable]{background:var(--paper);}
  #sched td[contenteditable]:focus{outline:2px solid var(--accent); outline-offset:-2px; background:#fff8f2;}
  .rowType-window{box-shadow:inset 3px 0 0 var(--window);}
  .rowType-door{box-shadow:inset 3px 0 0 var(--door);}
  .rowNoWork{box-shadow:inset 3px 0 0 #9a9488 !important;}
  .rowNoWork td{background:var(--panel) !important; color:var(--muted);}
  .levelHeaderRow td{
    background:var(--panel); font-weight:800; font-size:13px; color:var(--ink);
    border:1px solid var(--line); padding:8px 10px; position:sticky; top:37px;
  }
  .colDelBtn, .rowDelBtn{background:none; border:none; color:var(--muted); font-weight:900; cursor:pointer; font-size:13px; padding:0 2px;}
  .rowDelBtn{color:var(--danger); font-size:16px;}
  .addColHeaderBtn{
    background:transparent; border:2px solid #fff; color:#fff; border-radius:6px;
    padding:4px 10px; font-weight:800; font-size:16px; line-height:1;
  }
  #emptySched{padding:24px 16px; color:var(--muted); font-size:14px; display:none;}

  /* ---------- Share bar ---------- */
  #shareBar{
    flex:0 0 auto; display:flex; gap:8px; padding:8px 10px;
    padding-top:calc(8px + env(safe-area-inset-top));
    background:var(--panel); border-bottom:2px solid var(--ink);
  }
  #shareBar button{flex:1; background:var(--ink); color:#fff; border:none; border-radius:10px; padding:11px 4px; font-size:12.5px; font-weight:800;}
  #userMenuArea{flex:1; display:flex; align-items:center; justify-content:center;}
  #userMenuBtn{display:flex; align-items:center; justify-content:center; width:100%;}
  #unsyncedBanner{
    display:none; flex:0 0 auto; background:var(--danger); color:#fff;
    font-size:12.5px; font-weight:800; text-align:center; padding:9px 12px; cursor:pointer;
  }
  body.focus-mode #unsyncedBanner{display:none !important;}
  #shareBar button.secondary{background:var(--paper); color:var(--ink); border:2px solid var(--ink);}

  #dialogOverlay{
    position:fixed; inset:0; background:rgba(20,23,28,0.55);
    display:flex; align-items:center; justify-content:center; z-index:100;
    padding:24px;
  }
  #dialogCard{
    background:var(--paper); border-radius:14px; padding:18px; width:100%; max-width:340px;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
  }
  #dialogCard h3{margin:0 0 10px; font-size:16px; font-weight:800; color:var(--ink);}
  #dialogCard p{margin:0 0 14px; font-size:14px; color:var(--muted); line-height:1.4;}
  #dialogCard input{
    width:100%; font-size:16px; padding:10px 11px; border:2px solid var(--line); border-radius:8px;
    color:var(--ink); background:var(--paper); margin-bottom:14px;
  }
  #dialogCard input:focus{outline:none; border-color:var(--accent);}
  #dialogButtons{display:flex; gap:8px;}
  #dialogButtons button{flex:1; padding:11px 8px; font-size:14px; font-weight:800; border-radius:9px; border:2px solid var(--ink);}
  .dialogCancelBtn{background:var(--paper); color:var(--ink);}
  .dialogOkBtn{background:var(--ink); color:#fff;}
  .dialogDangerBtn{background:var(--danger); color:#fff; border-color:var(--danger);}

  /* Focus mode: entered whenever a window/door is selected. Hides everything except the
     canvas and the inline editor panel, so schedule-style field editing can happen without
     leaving the Plan tab. Structural plan editing (walls, joints, adding items) is only
     reachable after exiting - tap empty canvas or the panel's close button. */
  body.focus-mode header, body.focus-mode #tabs, body.focus-mode #toolbar, body.focus-mode #shareBar{
    display:none !important;
  }

  #photoViewerOverlay{
    position:fixed; inset:0; background:rgba(10,10,10,0.92); z-index:110;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  #photoViewerOverlay img{
    max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }

  #toast{
    position:fixed; left:50%; bottom:78px; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:#fff; padding:10px 16px; border-radius:999px;
    font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:50; max-width:88%; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  #printArea{display:none;}
  @media print{
    header,#tabs,#toolbar,#shareBar,#scheduleAddress,#planAddressFloat,#inlinePanel{display:none !important;}
    #views,.view,#canvasWrap,#scheduleWrap{position:static !important; overflow:visible !important; display:block !important;}
    body{overflow:visible !important;}
    #app > *:not(#printArea){display:none !important;}
    #printArea{display:block !important; padding:16px;}
    #printArea h1{font-size:20px; margin:0 0 2px;}
    #printArea .paddr{font-size:12px; color:#444; margin-bottom:2px;}
    #printArea .psub{font-size:11px; color:#555; margin-bottom:14px;}
    #printArea .plevel{page-break-before:always; padding-top:6px;}
    #printArea .plevel:first-of-type{page-break-before:auto;}
    #printArea .plevel h2{font-size:15px; margin:0 0 8px;}
    #printArea svg{width:100%; height:auto; border:1px solid #999;}
    #printArea table{border-collapse:collapse; width:100%; margin-top:10px; font-size:11px; page-break-before:always;}
    #printArea th,#printArea td{border:1px solid #999; padding:5px 7px; text-align:left;}
    #printArea th{background:#eee;}
    #printArea .plevelHeadCell{background:#eee; font-weight:800;}
  }
</style>
</head>
<body>
<div id="app" style="display:flex; flex-direction:column; height:100%;">

  <div id="shareBar">
    <button id="fileMenuBtn">File &#9662;</button>
    <button id="optionsMenuBtn">Options &#9662;</button>
    <div id="userMenuArea">
      <div id="googleSignInSlot"></div>
      <button id="userMenuBtn" style="display:none;"></button>
    </div>
  </div>

  <div id="unsyncedBanner"></div>

  <header>
    <div id="titleRow">
      <div id="title" contenteditable="true" spellcheck="false">Untitled Floor Plan</div>
      <div id="saveIndicator">Saved</div>
      <div id="cloudIndicator" style="font-size:11px; font-weight:700; color:var(--muted);"></div>
      <button id="undoBtn" disabled title="Undo last action">&#8630; Undo</button>
    </div>
    <div id="levelBar">
      <select id="levelSelect"></select>
      <button id="renameLevelBtn">Rename</button>
      <button id="addLevelBtn">+ Level</button>
    </div>
  </header>

  <div id="tabs">
    <div class="tab active" data-tab="plan">Plan</div>
    <div class="tab" data-tab="schedule">Window Schedule</div>
  </div>

  <div id="views">
    <div class="view active" id="view-plan">
      <div id="canvasWrap">
        <svg id="planSvg" viewBox="0 0 400 300"></svg>
        <div id="planAddressFloat"></div>
        <div id="zoomControls">
          <button id="zoomInBtn" title="Zoom in">+</button>
          <button id="zoomOutBtn" title="Zoom out">&#8722;</button>
          <button id="zoomFitBtn" title="Fit to plan">&#8853;</button>
        </div>
      </div>
      <div id="toolbar">
        <button class="tbtn active" data-mode="move">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18M7 7l-4 5 4 5M17 7l4 5-4 5M7 17l5 4 5-4M7 7l5-4 5 4"/></svg>
          Move
        </button>
        <button class="tbtn" data-mode="addWindow" id="addWindowBtn">
          <span id="windowDefaultBadge" class="tbtnBadge"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16"/><path d="M12 4v16M4 12h16"/></svg>
          + Window
        </button>
        <button class="tbtn" data-mode="addDoor">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20h4M18 20h4"/><path d="M6 20V6"/><path d="M6 6A14 14 0 0 1 18 20" stroke-dasharray="2 2"/></svg>
          + Door
        </button>
        <button class="tbtn" data-mode="addJoint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h6"/><path d="M14 12h6"/><rect x="9" y="9" width="6" height="6"/></svg>
          Joint
        </button>
        <button class="tbtn" data-mode="addLabel" id="addLabelBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
          + Label
        </button>
      </div>
      <div id="inlinePanel">
        <div id="inlinePanelHeader">
          <span id="inlinePanelTitle"></span>
          <button id="inlinePanelClose">✕</button>
        </div>
        <div id="inlinePanelBody"></div>
      </div>
    </div>

    <div class="view" id="view-schedule">
      <div id="scheduleAddress"></div>
      <div id="scheduleWrap">
        <table id="sched"></table>
        <div id="emptySched">No windows or doors yet. Add them from the Plan tab and they'll show up here.</div>
      </div>
    </div>
  </div>

  <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
</div>

<div id="toast"></div>
<div id="printArea"></div>

<script>
(function(){
"use strict";

/* ============================== CONSTANTS ============================== */
var GRID = 10;
var WALL_T = 10.5; // 75% of the previous 14pt thickness
var DEFAULT_OPENING_W = 40; // drawn units == 30 inches, per the crew's standard window width
var MIN_OPENING_W = 16;
var SAVE_KEY = 'floorplan-app-v3';

/* ============================== CLOUD SYNC CONFIG ============================== */
// Phase 2: cloud-synced plan storage. See v2-setup-notes.md for how these values
// were created (Google Cloud Console OAuth client + API Gateway invoke URL).
var GOOGLE_CLIENT_ID = '729662824435-u239ge82b6kc7v4pqc0qrhloqqe0u6ga.apps.googleusercontent.com';
var API_BASE = 'https://rc57geq62e.execute-api.us-east-1.amazonaws.com';

function inchesToUnits(inches){ return inches/30*DEFAULT_OPENING_W; }

var WINDOW_OPERATIONS = ['Double Hung','Casement','French Pair','Fixed','Hopper','Other'];
var DOOR_OPERATIONS = ['Door','French Pair','Fixed','Sidelite'];
var GLASS_OPTIONS = ['Clear','Wavy','Laminated','Leaded','Privacy','Stained Glass','Other'];
var SERVICE_LEVEL_OPTIONS = ['Rerope','Tuneup','Restoration','Repair','Glaze only','Glass only','Other'];
var SWING_OPTIONS = [
  {hingeSide:'p1', swingOut:false, label:'Inswing, Left'},
  {hingeSide:'p2', swingOut:false, label:'Inswing, Right'},
  {hingeSide:'p1', swingOut:true,  label:'Outswing, Left'},
  {hingeSide:'p2', swingOut:true,  label:'Outswing, Right'}
];
var CASEMENT_SWING_OPTIONS = [
  {value:'in', label:'Inswing'},
  {value:'out', label:'Outswing'}
];

// Preset schedule columns. kind: 'text' | 'dropdown' | 'swing' (door-only special control) | 'locked'.
// optionsFor(type) lets a column offer different choices for windows vs doors (e.g. Operation).
function presetColumnDefs(){
  return [
    {key:'label', label:'Window Number', kind:'text', maxLength:26, defaultVisible:true},
    {key:'type', label:'Type', kind:'locked', defaultVisible:true},
    {key:'completed', label:'Completed', kind:'checkbox', defaultVisible:true},
    {key:'inProgress', label:'In Progress', pdfLabel:'In Prog.', kind:'checkbox', defaultVisible:true},
    {key:'operation', label:'Operation', kind:'dropdown', defaultVisible:true,
      optionsFor:function(type){ return type==='window' ? WINDOW_OPERATIONS : DOOR_OPERATIONS; }},
    {key:'swing', label:'Swing', kind:'swing', appliesTo:'door', defaultVisible:true},
    {key:'width', label:'Width', kind:'text', defaultVisible:true},
    {key:'height', label:'Height', kind:'text', defaultVisible:true},
    {key:'lites', label:'Lites', kind:'text', defaultVisible:false},
    {key:'screen', label:'Screen', kind:'text', defaultVisible:false},
    {key:'glass', label:'Glass', kind:'dropdown', defaultVisible:false, optionsFor:function(){ return GLASS_OPTIONS; }},
    {key:'glassNotes', label:'Glass Notes', kind:'text', defaultVisible:false},
    {key:'hardware', label:'Hardware', kind:'text', defaultVisible:false},
    {key:'mfgMeasurements', label:'Manufacturing Measurements', kind:'text', defaultVisible:false},
    {key:'serviceLevel', label:'Service Level', kind:'dropdown', defaultVisible:true, optionsFor:function(){ return SERVICE_LEVEL_OPTIONS; }},
    {key:'repairDetails', label:'Repair Details', kind:'text', defaultVisible:false},
    {key:'notes', label:'Notes', kind:'text', defaultVisible:true}
  ];
}
function defaultColumnVisibility(){
  var v = {};
  presetColumnDefs().forEach(function(c){ v[c.key] = !!c.defaultVisible; });
  return v;
}
// Effective columns to render right now: visible presets (skipping ones that don't apply to
// EITHER opening type present, e.g. Swing only shows if there's at least one door somewhere -
// simplified here to "always show if visible", per-row logic decides whether a cell applies)
// plus any custom columns the crew has added on top.
function visiblePresetColumns(){
  var vis = state.columnVisibility || defaultColumnVisibility();
  return presetColumnDefs().filter(function(c){ return !!vis[c.key]; });
}
function allColumnsForDisplay(){
  return visiblePresetColumns().concat(state.customColumns || []);
}

/* ============================== ID / DEFAULTS ============================== */
var idSeed = 1;
function nextId(){ return 'v' + (idSeed++) + '_' + Math.random().toString(36).slice(2,7); }

function defaultBox(){
  // 3x the footprint of the original default box, so a new plan has room for a larger
  // building before anyone hits the edge of the drawable area.
  return [
    {id:nextId(), x:40, y:40},
    {id:nextId(), x:940, y:40},
    {id:nextId(), x:940, y:640},
    {id:nextId(), x:40, y:640}
  ];
}

function makeLevel(name){
  return { id: nextId(), name: name, vertices: defaultBox(), openings: [], labels: [], interiorLines: [], locks: {walls:false, openings:false} };
}

/* ============================== STATE ============================== */
var state = {
  title: 'Untitled Floor Plan',
  address: '',
  levels: [ makeLevel('Level 1') ],
  activeLevelIndex: 0,
  columnVisibility: defaultColumnVisibility(),
  customColumns: [],
  defaultWindowOperation: 'Double Hung',
  // Cloud sync metadata (Phase 2). planId is generated client-side the moment a plan
  // exists (see init()/doStartNew()) so it's stable before the first cloud save ever happens.
  planId: null,
  status: 'Draft',
  lastEditedAt: null // the lastEditedAt we last loaded/saved with - used for conflict detection
};

var ui = {
  tab: 'plan',
  mode: 'move',
  selectedOpeningId: null,
  selectedLabelId: null,
  selectedInteriorId: null,
  drawPreview: null
};
var pendingPhotoOpeningId = null;
var justPlacedLabelId = null;
var activeDragCleanup = null; // set by whichever drag is currently in progress; a second touch calls this to interrupt it cleanly
var pendingPhotoSlot = null;

// Cloud auth state (Phase 2)
var googleIdToken = null;
var googleTokenExp = 0;
var currentUserEmail = null;

function currentLevel(){ return state.levels[state.activeLevelIndex]; }

/* ============================== GEOMETRY HELPERS ============================== */
function dist(a,b){ return Math.hypot(b.x-a.x, b.y-a.y); }
function snap(v){ return Math.round(v/GRID)*GRID; }

function edges(verts){
  var n = verts.length, out = [];
  for(var i=0;i<n;i++){
    var v1 = verts[i], v2 = verts[(i+1)%n];
    out.push({index:i, key:v1.id+'|'+v2.id, v1:v1, v2:v2, len:dist(v1,v2), horizontal: v1.y===v2.y});
  }
  return out;
}

function polygonCentroid(verts){
  var x=0,y=0;
  verts.forEach(function(v){ x+=v.x; y+=v.y; });
  return {x:x/verts.length, y:y/verts.length};
}

// The centroid-distance heuristic this used to use ("pick whichever normal points away from
// the polygon's centroid") only works for convex shapes - on an L-shaped or notched footprint,
// walls near a concave corner can have their true outward direction pointing back toward the
// centroid, silently flipping in/out for any door on that specific wall. Using the polygon's
// winding direction instead is correct for every edge on any simple polygon, concave or not:
// once you know which way the vertex loop turns, a single fixed 90-degree rotation of each
// edge's direction gives its outward normal - no centroid needed.
function outwardNormalForEdge(v1, v2, clockwise){
  var dx=v2.x-v1.x, dy=v2.y-v1.y, len=Math.hypot(dx,dy);
  var ux=dx/len, uy=dy/len;
  var n1={x:-uy,y:ux};
  return clockwise ? {x:-n1.x,y:-n1.y} : n1;
}

function boundingBox(verts){
  var xs=verts.map(function(v){return v.x;}), ys=verts.map(function(v){return v.y;});
  return {minX:Math.min.apply(null,xs), maxX:Math.max.apply(null,xs), minY:Math.min.apply(null,ys), maxY:Math.max.apply(null,ys)};
}

// Standard ray-casting point-in-polygon test against the exterior wall vertex loop.
function pointInPolygon(pt, verts){
  var inside = false;
  for(var i=0,j=verts.length-1; i<verts.length; j=i++){
    var xi=verts[i].x, yi=verts[i].y, xj=verts[j].x, yj=verts[j].y;
    var intersect = ((yi>pt.y)!==(yj>pt.y)) && (pt.x < (xj-xi)*(pt.y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

// Samples along a segment rather than just its endpoints, so an interior line/rectangle edge
// can't sneak outside through a concave notch in an L-shaped footprint.
function segmentAllInside(p1, p2, verts, samples){
  samples = samples || 12;
  for(var i=0;i<=samples;i++){
    var t = i/samples;
    var pt = {x:p1.x+(p2.x-p1.x)*t, y:p1.y+(p2.y-p1.y)*t};
    if(!pointInPolygon(pt, verts)) return false;
  }
  return true;
}

function rectAllInside(x1,y1,x2,y2, verts){
  var corners = [{x:x1,y:y1},{x:x2,y:y1},{x:x2,y:y2},{x:x1,y:y2}];
  for(var i=0;i<4;i++){
    if(!segmentAllInside(corners[i], corners[(i+1)%4], verts, 10)) return false;
  }
  return true;
}

function closestPointOnSegment(p, a, b){
  var abx=b.x-a.x, aby=b.y-a.y;
  var lenSq = abx*abx+aby*aby;
  var t = lenSq>0 ? ((p.x-a.x)*abx+(p.y-a.y)*aby)/lenSq : 0;
  t = Math.max(0, Math.min(1, t));
  return {x:a.x+abx*t, y:a.y+aby*t};
}

function nearestPointOnPolygonBoundary(pt, verts){
  var best=null, bestDist=Infinity;
  for(var i=0;i<verts.length;i++){
    var cp = closestPointOnSegment(pt, verts[i], verts[(i+1)%verts.length]);
    var d = dist(pt, cp);
    if(d<bestDist){ bestDist=d; best=cp; }
  }
  return best;
}

// Interior lines/rectangles are allowed some buffer past the exterior wall while being
// dragged (touching or slightly crossing the wall is completely normal - interior walls
// commonly run right up to it), but the point actually stored is always pulled back onto
// the boundary rather than left floating outside. If already inside, returns it unchanged.
function clampPointToPolygon(pt, verts){
  if(pointInPolygon(pt, verts)) return pt;
  return nearestPointOnPolygonBoundary(pt, verts);
}

// Positive => the vertex loop, traversed in array order, runs counter-clockwise on screen (y grows downward).
// Negative => clockwise on screen. (Verified numerically against a hand-traced box.)
function isClockwiseSvg(verts){
  var sum=0;
  for(var i=0;i<verts.length;i++){
    var a=verts[i], b=verts[(i+1)%verts.length];
    sum += (b.x-a.x)*(b.y+a.y);
  }
  return sum < 0;
}

function pointAt(e, along){
  var t = along/e.len;
  return {x:e.v1.x+(e.v2.x-e.v1.x)*t, y:e.v1.y+(e.v2.y-e.v1.y)*t};
}

function sumOpeningWidths(lvl, wallKey){
  return lvl.openings.filter(function(o){ return o.wallKey===wallKey; })
                     .reduce(function(sum,o){ return sum+o.width; }, 0);
}

function adjacentEdgeKeys(verts, edgeIndex){
  var n = verts.length;
  var i2 = (edgeIndex+1)%n, i0 = (edgeIndex-1+n)%n, i3 = (i2+1)%n;
  var v1 = verts[edgeIndex], v2 = verts[i2], vPrev = verts[i0], vNext = verts[i3];
  return { prevEdgeKey: vPrev.id+'|'+v1.id, nextEdgeKey: v2.id+'|'+vNext.id };
}

// Dragging a wall doesn't change ITS OWN length (both endpoints move together, preserving
// distance) - it changes the length of the two NEIGHBORING walls that each share one of those
// endpoints. So the hard-stop checks both neighbors' combined-opening-width minimums, not the
// dragged wall itself.
// gapBaseline (optional): {wallKey: [gap, gap, ...]} frozen at the start of a drag gesture -
// see startWallDrag for why this matters.
function pushWall(edgeIndex, delta, gapBaseline){
  var lvl = currentLevel();
  var verts = lvl.vertices, n = verts.length;
  var i2 = (edgeIndex+1)%n, i0 = (edgeIndex-1+n)%n, i3 = (i2+1)%n;
  var v1 = verts[edgeIndex], v2 = verts[i2];
  var vPrev = verts[i0], vNext = verts[i3];
  var horizontal = (v1.y===v2.y);

  var keys = adjacentEdgeKeys(verts, edgeIndex);
  var prevEdgeKey = keys.prevEdgeKey, nextEdgeKey = keys.nextEdgeKey;
  var minPrev = sumOpeningWidths(lvl, prevEdgeKey);
  var minNext = sumOpeningWidths(lvl, nextEdgeKey);

  function lengthsAt(d){
    var nv1 = horizontal ? {x:v1.x, y:v1.y+d} : {x:v1.x+d, y:v1.y};
    var nv2 = horizontal ? {x:v2.x, y:v2.y+d} : {x:v2.x+d, y:v2.y};
    return { prevLen: dist(vPrev, nv1), nextLen: dist(nv2, vNext) };
  }
  function violates(d){
    var L = lengthsAt(d);
    return (L.prevLen < minPrev - 0.01) || (L.nextLen < minNext - 0.01);
  }

  var safeDelta = delta;
  if(violates(delta)){
    var lo=0, hi=delta;
    for(var iter=0; iter<30; iter++){
      var mid = (lo+hi)/2;
      if(violates(mid)) hi = mid; else lo = mid;
    }
    safeDelta = lo;
  }

  if(horizontal){
    var ny = snap(v1.y+safeDelta);
    v1.y = ny; v2.y = ny;
  } else {
    var nx = snap(v1.x+safeDelta);
    v1.x = nx; v2.x = nx;
  }
  clampOpeningsToWalls(gapBaseline);
}

// Scales the gaps between openings on a wall proportionally as it resizes, in order, never
// letting them overlap. Shrinking compresses the gaps down (racking them edge-to-edge once
// gaps hit zero - pushWall's hard-stop above prevents shrinking past that point). Growing
// spreads the gaps back out using whatever ratio they're currently at, which may or may not
// match the original pre-rack proportions - that's fine, nothing needs to be remembered.
function rackOpeningsOnWall(openingsOnWall, wallLen, baseline){
  if(!openingsOnWall.length) return;
  var sorted = openingsOnWall.slice().sort(function(a,b){ return a.offset - b.offset; });
  var totalWidth = sorted.reduce(function(sum,o){ return sum+o.width; }, 0);

  if(totalWidth >= wallLen){
    var x = 0;
    sorted.forEach(function(o){ o.offset = snap(x); x += o.width; });
    return;
  }

  // baseline (optional): gap ratios frozen at the start of the current drag gesture. Without
  // it, gaps would be re-derived from the already-snapped result of the previous call every
  // time - fine for a single step, but across many small steps in one drag that compounds
  // rounding drift and can let an individual gap snap to exactly zero and get stuck there even
  // as the wall keeps growing. Freezing the ratios for the gesture avoids that; a brand new
  // drag gesture later is free to establish a new baseline from wherever things ended up.
  var naturalGaps = baseline;
  if(!naturalGaps || naturalGaps.length !== sorted.length){
    naturalGaps = [];
    for(var i=0;i<sorted.length;i++){
      var prevEnd = i===0 ? 0 : (sorted[i-1].offset + sorted[i-1].width);
      naturalGaps.push(Math.max(0, sorted[i].offset - prevEnd));
    }
  }
  var totalNaturalGap = naturalGaps.reduce(function(a,b){ return a+b; }, 0);
  var availableGapSpace = wallLen - totalWidth;
  var gapScale = totalNaturalGap > 0 ? (availableGapSpace/totalNaturalGap) : 0;

  var x = 0;
  sorted.forEach(function(o, i){
    x += naturalGaps[i]*gapScale;
    o.offset = snap(Math.max(0, x));
    x += o.width;
  });
}

function computeGapBaseline(lvl, wallKey){
  var openingsOnWall = lvl.openings.filter(function(o){ return o.wallKey===wallKey; });
  if(!openingsOnWall.length) return null;
  var sorted = openingsOnWall.slice().sort(function(a,b){ return a.offset - b.offset; });
  var gaps = [];
  for(var i=0;i<sorted.length;i++){
    var prevEnd = i===0 ? 0 : (sorted[i-1].offset + sorted[i-1].width);
    gaps.push(Math.max(0, sorted[i].offset - prevEnd));
  }
  return gaps;
}

function clampOpeningsToWalls(gapBaseline){
  var lvl = currentLevel();
  var eByKey = {};
  edges(lvl.vertices).forEach(function(e){ eByKey[e.key]=e; });
  lvl.openings = lvl.openings.filter(function(o){ return !!eByKey[o.wallKey]; });
  var byWall = {};
  lvl.openings.forEach(function(o){
    if(!byWall[o.wallKey]) byWall[o.wallKey] = [];
    byWall[o.wallKey].push(o);
  });
  Object.keys(byWall).forEach(function(key){
    rackOpeningsOnWall(byWall[key], eByKey[key].len, gapBaseline && gapBaseline[key]);
  });
}

/* ---- Joints: mark a bendable point on a wall without moving anything yet ---- */
function insertJoint(edgeIndex, t){
  var lvl = currentLevel();
  var verts = lvl.vertices;
  var e = edges(verts)[edgeIndex];
  var len = e.len;
  if(len < 24) return {ok:false, reason:'short'};
  var clickDist = t*len;

  // Every existing joint (or hard corner) sits exactly at one end of some edge, so checking
  // distance from both ends of THIS edge is sufficient to catch "too close to an existing one" -
  // scaled down for shorter walls so this never makes a valid-length wall un-jointable.
  var minSpacing = Math.min(30, len*0.15);
  if(clickDist < minSpacing || clickDist > len - minSpacing){
    return {ok:false, reason:'tooClose'};
  }

  var margin = 6;
  lvl.openings.filter(function(o){ return o.wallKey===e.key; }).forEach(function(o){
    if(clickDist > o.offset-margin && clickDist < o.offset+o.width+margin){
      var dS = Math.abs(clickDist-o.offset), dE = Math.abs(clickDist-(o.offset+o.width));
      clickDist = dS<dE ? o.offset : (o.offset+o.width);
    }
  });
  clickDist = Math.max(6, Math.min(len-6, clickDist));

  var ux=(e.v2.x-e.v1.x)/len, uy=(e.v2.y-e.v1.y)/len;
  var jointId = nextId();
  var pt = {x:snap(e.v1.x+ux*clickDist), y:snap(e.v1.y+uy*clickDist)};
  var Ja = {id:nextId(), x:pt.x, y:pt.y, joint:true, jointId:jointId};
  var Jb = {id:nextId(), x:pt.x, y:pt.y, joint:true, jointId:jointId};

  var out = [];
  for(var k=0;k<verts.length;k++){
    out.push(verts[k]);
    if(k===edgeIndex) out.push(Ja, Jb);
  }
  lvl.vertices = out;

  lvl.openings.forEach(function(o){
    if(o.wallKey!==e.key) return;
    if(o.offset+o.width <= clickDist+0.001){
      o.wallKey = e.v1.id+'|'+Ja.id;
    } else {
      o.wallKey = Jb.id+'|'+e.v2.id;
      o.offset = o.offset - clickDist;
    }
  });
  return {ok:true};
}

function removeJoint(jointVertexId){
  var lvl = currentLevel();
  var verts = lvl.vertices;
  var n = verts.length;
  var idx = verts.findIndex(function(v){ return v.id===jointVertexId; });
  if(idx<0) return {ok:false};
  var v = verts[idx];
  if(!v.joint) return {ok:false};
  var otherIdx = verts.findIndex(function(x,i){ return i!==idx && x.jointId===v.jointId; });
  if(otherIdx<0) return {ok:false};
  var jaIdx = Math.min(idx,otherIdx), jbIdx = Math.max(idx,otherIdx);
  var ja = verts[jaIdx], jb = verts[jbIdx];
  if(ja.x!==jb.x || ja.y!==jb.y) return {ok:false, reason:'not-flush'};

  var aIdx = (jaIdx-1+n)%n, bIdx = (jbIdx+1)%n;
  var A = verts[aIdx], B = verts[bIdx];
  var distAtoJa = dist(A, ja);

  lvl.openings.forEach(function(o){
    var leftKey = A.id+'|'+ja.id, rightKey = jb.id+'|'+B.id;
    if(o.wallKey===leftKey){
      o.wallKey = A.id+'|'+B.id;
    } else if(o.wallKey===rightKey){
      o.wallKey = A.id+'|'+B.id;
      o.offset = o.offset + distAtoJa;
    }
  });

  lvl.vertices = verts.filter(function(x){ return x!==ja && x!==jb; });
  return {ok:true};
}

/* ============================== PERSISTENCE ============================== */
var saveTimer=null;
var undoStack = [];
var UNDO_MAX = 5;
var lastStableSnapshot = null; // state as it was at the end of the last completed action/burst

// Storage abstraction: prefers Claude's artifact-only window.storage API when present (so this
// file keeps working unmodified inside Claude), falls back to IndexedDB otherwise - which is
// what a real deployed/standalone copy of this app will use. Same file, either environment.
var IDB_NAME = 'floorplanAppDB';
var IDB_STORE = 'kv';
var idbPromise = null;
function openIdb(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
    var req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return idbPromise;
}
function persistSet(key, value){
  if(window.storage && window.storage.set){
    return window.storage.set(key, value, false);
  }
  return openIdb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function persistGet(key){
  if(window.storage && window.storage.get){
    return window.storage.get(key);
  }
  return openIdb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readonly');
      var req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = function(){ resolve(req.result!==undefined ? {key:key, value:req.result} : null); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}

// Timestamp of the most recent edit and the most recent successful CLOUD sync. Deliberately
// separate from lastStableSnapshot below, which only tracks whether state has been flushed to
// LOCAL storage - that happens every 500ms regardless of whether the cloud sync succeeds, so it
// can't be used to detect "this device hasn't reached the cloud in a while" (that was the bug:
// the unsynced-work banner never fired because lastStableSnapshot always caught up locally
// within 500ms even while fully offline, making hasUnsyncedChanges() go false immediately).
var lastEditAt = null;
var lastSuccessfulSyncAt = null;
var unsyncedSinceAt = null; // when the current streak of edits-not-yet-in-the-cloud began

function scheduleSave(){
  lastEditAt = Date.now();
  // Mark the start of an unsynced streak the moment it begins, not on some later timer tick -
  // this is what the unsynced-work banner counts from (see updateUnsyncedBanner).
  if(!unsyncedSinceAt) unsyncedSinceAt = lastEditAt;
  // First change in a new burst of activity - the debounce timer isn't already running.
  // Capture what state looked like BEFORE this burst as the undo point.
  if(!saveTimer && lastStableSnapshot){
    undoStack.push(lastStableSnapshot);
    if(undoStack.length > UNDO_MAX) undoStack.shift();
    updateUndoButton();
  }
  setSaveIndicator('Saving…');
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
}
function doSave(){
  saveTimer = null;
  try{
    persistSet(SAVE_KEY, JSON.stringify(state))
      .then(function(){ setSaveIndicator('Saved'); })
      .catch(function(){ setSaveIndicator('Not saved'); });
  }catch(e){ setSaveIndicator('Not saved'); }
  lastStableSnapshot = JSON.stringify(state);
  syncToCloud();
}

/* ============================== CLOUD SYNC ============================== */
// Local IndexedDB save (above) always happens first and is the safety net - cloud sync
// is best-effort on top of it. If it fails (offline, not signed in), local work is never lost.

function isSignedIn(){
  return !!googleIdToken && (Date.now()/1000) < googleTokenExp;
}

function setCloudIndicator(text){
  var el = document.getElementById('cloudIndicator');
  if(el) el.textContent = text;
}

function apiFetch(path, opts){
  opts = opts || {};
  if(!isSignedIn()) return Promise.reject(new Error('not signed in'));
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers, {
    'Authorization': 'Bearer ' + googleIdToken
  });
  return fetch(API_BASE + path, opts);
}

// Clone of state safe to send to the cloud. The base64 photo previews (o.photos) are stripped -
// those would blow past DynamoDB's 400KB item limit fast - but o.photoKeys (the small S3 key
// references, uploaded separately via uploadPhotoToCloud) pass through untouched. That's how a
// photo actually travels between devices: the key syncs in the data blob, the pixels live in S3.
function stateForCloud(){
  var clone = JSON.parse(JSON.stringify(state));
  clone.levels.forEach(function(lvl){
    (lvl.openings||[]).forEach(function(o){ delete o.photos; });
  });
  return clone;
}

// Flat list of every S3 key referenced anywhere in the plan - sent alongside `data` so the
// server knows which keys to generate fresh view URLs for on the next load (see getPlan in
// the Lambda, which already does this for whatever's in this list - no backend change needed).
function collectPhotoKeys(){
  var keys = [];
  state.levels.forEach(function(lvl){
    (lvl.openings||[]).forEach(function(o){
      if(!o.photoKeys) return;
      if(o.photoKeys.interior) keys.push(o.photoKeys.interior);
      if(o.photoKeys.exterior) keys.push(o.photoKeys.exterior);
    });
  });
  return keys;
}

function syncToCloud(){
  if(!isSignedIn()){ setCloudIndicator(''); return; }
  if(!state.planId) return; // shouldn't happen - init()/doStartNew() always assign one
  var body = {
    jobName: state.title,
    address: state.address,
    status: state.status || 'Draft',
    data: stateForCloud(),
    photos: collectPhotoKeys(),
    expectedLastEditedAt: state.lastEditedAt
  };
  setCloudIndicator('Syncing…');
  apiFetch('/plans/' + state.planId, { method:'PUT', body: JSON.stringify(body) })
    .then(function(res){
      if(res.status === 409){
        return res.json().then(function(conflict){ handleSaveConflict(conflict); });
      }
      if(!res.ok) throw new Error('save failed: ' + res.status);
      return res.json().then(function(saved){
        state.lastEditedAt = saved.lastEditedAt;
        lastStableSnapshot = JSON.stringify(state); // keep the "any unsaved edits?" signal accurate
        lastSuccessfulSyncAt = Date.now();
        unsyncedSinceAt = null; // this is what actually clears the unsynced-work banner
        updateUnsyncedBanner(); // react immediately instead of waiting up to 30s for the next timer tick
        setCloudIndicator('Synced');
        return persistSet(SAVE_KEY, JSON.stringify(state));
      });
    })
    .catch(function(err){
      console.error('Cloud sync failed', err);
      setCloudIndicator('Not synced');
    });
}

function dataUrlToBlob(dataUrl){
  return fetch(dataUrl).then(function(r){ return r.blob(); });
}

// Uploads a captured photo to S3 via a presigned URL, then records the S3 key on the opening
// so the next autosave includes it. The local base64 preview (o.photos[slot]) is already showing
// instantly by the time this runs - this is purely what makes the photo travel to other devices.
// Skips silently if not signed in: the photo still works fine on this device either way, it just
// won't sync until the next successful capture while signed in.
function uploadPhotoToCloud(openingId, slot, dataUrl){
  if(!isSignedIn()) return;
  apiFetch('/photos/upload-url', {
    method: 'POST',
    body: JSON.stringify({ planId: state.planId, openingId: openingId, kind: slot })
  }).then(function(res){
    if(!res.ok) throw new Error('could not get upload URL');
    return res.json();
  }).then(function(data){
    return dataUrlToBlob(dataUrl).then(function(blob){
      return fetch(data.uploadUrl, { method:'PUT', headers:{'Content-Type':'image/jpeg'}, body: blob });
    }).then(function(putRes){
      if(!putRes.ok) throw new Error('S3 upload failed');
      var lvl = currentLevel();
      var o = lvl.openings.find(function(x){ return x.id===openingId; });
      if(!o) return; // opening was deleted while the upload was in flight - nothing to record
      if(!o.photoKeys) o.photoKeys = {interior:null, exterior:null};
      o.photoKeys[slot] = data.key;
      scheduleSave();
    });
  }).catch(function(err){
    console.error('Photo cloud upload failed', err);
    toast('Photo saved on this device, but the cloud upload failed');
  });
}

// Someone else saved this plan since we last loaded it. Ask which version to keep rather
// than silently overwriting - this is the whole point of tracking expectedLastEditedAt.
function handleSaveConflict(conflict){
  setCloudIndicator('Conflict - action needed');
  showMenuDialog('This plan changed elsewhere', [
    { label: 'Keep my changes (overwrite theirs)', onClick: function(){
        state.lastEditedAt = conflict.current.lastEditedAt;
        syncToCloud();
      }
    },
    { label: 'Discard mine, load ' + (conflict.current.lastEditedBy || 'their') + ' version', onClick: function(){
        loadCloudPlanIntoState(conflict.current);
        toast('Loaded the latest version');
      }, danger: true
    }
  ]);
}

// Whether state has been flushed to LOCAL storage yet (mid-debounce vs. settled) - used only to
// decide if it's safe to silently overwrite in-memory state with a freshly-fetched cloud version
// without losing a keystroke that hasn't been saved anywhere yet. NOT a cloud-sync signal.
function hasUnflushedEdits(){
  return JSON.stringify(state) !== lastStableSnapshot;
}

// Periodically checks whether someone else has saved a newer version of the plan you have
// open - not real-time sync, just a "did anything change while I wasn't looking" nudge. If
// nothing local is unsaved, it's safe to quietly catch up. If there ARE local unsaved edits,
// this only warns - it never overwrites your in-progress work. Actual conflict resolution at
// save time still goes through the existing 409/stale-data dialog either way.
var REFRESH_CHECK_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes
var refreshCheckTimer = null;

function checkForNewerVersion(){
  if(!isSignedIn() || !state.planId) return;
  if(activeDragCleanup) return; // don't refresh out from under an in-progress drag/gesture
  apiFetch('/plans/' + state.planId).then(function(res){
    return res.ok ? res.json() : null;
  }).then(function(rec){
    if(!rec || !rec.lastEditedAt || rec.lastEditedAt === state.lastEditedAt) return;
    if(!hasUnflushedEdits()){
      loadCloudPlanIntoState(rec);
      toast('Updated to the latest version' + (rec.lastEditedBy ? ' (' + rec.lastEditedBy + ')' : ''));
    } else {
      setCloudIndicator('Newer version available');
      toast((rec.lastEditedBy || 'Someone') + ' updated this plan - your changes are still safe locally');
    }
  }).catch(function(){ /* silent - this is a non-critical background check */ });
}

// Persistent, hard-to-miss warning (not just the small cloudIndicator text) for when a device
// has been sitting on edits that haven't reached the CLOUD in a while - driven by lastEditAt /
// lastSuccessfulSyncAt (set in scheduleSave/syncToCloud/loadCloudPlanIntoState above), not by
// local-storage flush state, which settles within 500ms regardless of connectivity and would
// never trigger this. The real risk this guards against is two people offline on the same plan
// for 30-40+ min each, diverging without either knowing. Doesn't try to fix that (no auto-merge -
// see earlier discussion), just makes the accumulating risk visible in real time.
var UNSYNCED_WARNING_THRESHOLD_MS = 10 * 60 * 1000; // 10 minutes
var unsyncedBannerTimer = null;

function updateUnsyncedBanner(){
  var banner = document.getElementById('unsyncedBanner');
  if(!banner) return;
  var staleMs = unsyncedSinceAt ? (Date.now() - unsyncedSinceAt) : 0;
  if(unsyncedSinceAt && staleMs > UNSYNCED_WARNING_THRESHOLD_MS){
    var mins = Math.floor(staleMs / 60000);
    banner.textContent = '⚠ Not synced for ' + mins + ' min — changes are only on this device. Tap to retry.';
    banner.style.display = 'block';
  } else {
    banner.style.display = 'none';
  }
}

function startUnsyncedBannerTimer(){
  if(unsyncedBannerTimer) clearInterval(unsyncedBannerTimer);
  unsyncedBannerTimer = setInterval(updateUnsyncedBanner, 30 * 1000);
  updateUnsyncedBanner();
}

function startPeriodicRefreshCheck(){
  if(refreshCheckTimer) clearInterval(refreshCheckTimer);
  refreshCheckTimer = setInterval(checkForNewerVersion, REFRESH_CHECK_INTERVAL_MS);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') checkForNewerVersion();
  });
}

// After applyLoadedState() restores levels/openings (including their photoKeys), swap in the
// fresh presigned view URLs the server just generated (rec.photoUrls, keyed by S3 key) so
// photos captured on OTHER devices actually display here.
function resolvePhotoUrls(rec){
  if(!rec.photoUrls) return;
  state.levels.forEach(function(lvl){
    (lvl.openings||[]).forEach(function(o){
      if(!o.photoKeys) return;
      ['interior','exterior'].forEach(function(slot){
        var key = o.photoKeys[slot];
        if(key && rec.photoUrls[key]) o.photos[slot] = rec.photoUrls[key];
      });
    });
  });
}

// Pulls a full plan record (as returned by GET/PUT /plans/{id}) into working state.
function loadCloudPlanIntoState(rec){
  applyLoadedState(rec.data || {});
  resolvePhotoUrls(rec);
  state.planId = rec.planId;
  state.title = rec.jobName || state.title;
  state.address = rec.address || state.address;
  state.status = rec.status || 'Draft';
  state.lastEditedAt = rec.lastEditedAt || null;
  ui.selectedOpeningId = null; ui.selectedLabelId = null;
  setMode('move');
  populateLevelSelect();
  updateTitleField();
  updateAddressDisplays();
  if(window.updateWindowDefaultBadge) window.updateWindowDefaultBadge();
  refreshSvg();
  buildScheduleIfActive();
  undoStack = [];
  updateUndoButton();
  lastStableSnapshot = JSON.stringify(state);
  // Just loaded straight from the cloud, so this device is caught up as of right now regardless
  // of whether the doSave() below's own round-trip succeeds - clears the unsynced-work banner.
  lastEditAt = null;
  lastSuccessfulSyncAt = Date.now();
  unsyncedSinceAt = null;
  updateUnsyncedBanner();
  doSave();
}

// Fetches and opens a specific cloud plan by id - shared by the HWR Plans list, a shared
// link's ?plan= param, and the post-sign-in retry for a shared link opened while signed out.
function openPlanById(planId){
  toast('Opening plan…');
  apiFetch('/plans/'+planId).then(function(res){
    if(!res.ok) throw new Error('load failed');
    return res.json();
  }).then(function(rec){
    loadCloudPlanIntoState(rec);
    toast('Loaded');
  }).catch(function(){ toast('Could not open that plan'); });
}

var pendingSharedPlanId = null;

// Reads ?plan=<id> off the URL (how a shared link opens a specific plan) and cleans it from
// the address bar so a refresh doesn't keep re-triggering it. If not signed in yet, the id is
// held and retried automatically right after sign-in completes (see handleGoogleCredential).
function checkUrlForSharedPlan(){
  var params = new URLSearchParams(location.search);
  var planId = params.get('plan');
  if(!planId) return;
  if(window.history && history.replaceState) history.replaceState({}, '', location.pathname);
  if(isSignedIn()){
    openPlanById(planId);
  } else {
    pendingSharedPlanId = planId;
    requireSignInDialog('Sign in to open this shared plan.');
  }
}

// Puts a link to the current plan on the clipboard (or the OS share sheet on mobile) so it
// can be dropped into Slack, Airtable, wherever - opening it loads this exact plan directly.
function shareCloudLink(){
  if(!state.planId){ toast('Nothing to share yet'); return; }
  var url = location.origin + location.pathname + '?plan=' + encodeURIComponent(state.planId);
  if(navigator.share){
    navigator.share({ title: state.title || 'Floor Plan', url: url })
      .catch(function(err){ if(err && err.name==='AbortError') return; copyLinkFallback(url); });
  } else {
    copyLinkFallback(url);
  }
}
function copyLinkFallback(url){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      toast('Link copied');
    }).catch(function(){ promptShowLink(url); });
  } else {
    promptShowLink(url);
  }
}
function promptShowLink(url){
  showPromptDialog({
    title: 'Copy this link', defaultValue: url, okLabel: 'Done',
    onSubmit: function(){}
  });
}

function editStatus(){
  var options = ['Draft','Sold','In Progress','Complete'].map(function(s){
    return { label: (state.status===s ? '✓ ' : '') + s, onClick: function(){
      state.status = s; scheduleSave(); toast('Status: ' + s);
    } };
  });
  showMenuDialog('Set status', options);
}

/* ============================== GOOGLE SIGN-IN ============================== */
function decodeJwt(token){
  try{
    var payload = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    var json = decodeURIComponent(atob(payload).split('').map(function(c){
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}

var USER_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>';

function updateUserMenuButton(){
  var btn = document.getElementById('userMenuBtn');
  var slot = document.getElementById('googleSignInSlot');
  if(!btn) return;
  if(isSignedIn()){
    btn.innerHTML = USER_ICON_SVG;
    btn.title = 'Signed in as ' + currentUserEmail;
    btn.style.display = '';
    if(slot) slot.style.display = 'none';
  } else {
    // Signed-out state is Google's own rendered button (see initGoogleAuth), not this one -
    // it's the only sign-in trigger that reliably works even after someone has dismissed the
    // One Tap prompt once (see note on initGoogleAuth for why).
    btn.style.display = 'none';
    if(slot) slot.style.display = '';
  }
}

function handleGoogleCredential(response){
  var claims = decodeJwt(response.credential);
  if(!claims){ toast('Sign-in failed'); return; }
  googleIdToken = response.credential;
  googleTokenExp = claims.exp;
  currentUserEmail = claims.email;
  updateUserMenuButton();
  toast('Signed in');
  if(pendingSharedPlanId){
    var pid = pendingSharedPlanId; pendingSharedPlanId = null;
    openPlanById(pid);
  } else {
    syncToCloud(); // catch up any edits made before sign-in completed
  }
}

function signOutUser(){
  googleIdToken = null; googleTokenExp = 0; currentUserEmail = null;
  if(window.google && google.accounts && google.accounts.id){ google.accounts.id.disableAutoSelect(); }
  updateUserMenuButton();
  setCloudIndicator('');
  toast('Signed out');
}

// Renders Google's own small icon-only button into #googleSignInSlot for the signed-out state,
// rather than a custom button calling prompt() on click. This matters: once someone dismisses
// or misses the One Tap prompt, Google suppresses it from auto-showing again for a while, and
// prompt() calls after that go silently nowhere - which is exactly the bug where the old custom
// "Sign In" button stopped working after being missed once. A real rendered Google button is a
// direct user gesture, not an auto-prompt, and isn't subject to that suppression - it always works.
function initGoogleAuth(){
  if(!window.google || !google.accounts || !google.accounts.id){
    setTimeout(initGoogleAuth, 300); // gsi/client script may still be loading
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential,
    auto_select: true
  });
  var slot = document.getElementById('googleSignInSlot');
  if(slot){
    google.accounts.id.renderButton(slot, { type:'icon', theme:'outline', size:'medium', shape:'circle' });
  }
  updateUserMenuButton();
  google.accounts.id.prompt(); // opportunistic silent re-sign-in for a returning session - fine
                                // if this gets suppressed, since the rendered button above always works
}

// Any action that needs cloud access (HWR Plans, etc.) routes through here instead of a toast
// that's easy to miss. Points at the real sign-in button (top right) rather than trying to
// trigger sign-in itself - a dialog button can't reliably drive Google's rendered widget, and
// prompt() alone is the exact mechanism that silently stops working after being dismissed once.
function requireSignInDialog(message){
  showConfirmDialog({
    title: 'Sign in required',
    message: (message || 'Sign in to continue.') + ' Tap the sign-in icon at the top right.',
    okLabel: 'Got it',
    cancelLabel: 'Close'
  });
}
function updateUndoButton(){
  var btn = document.getElementById('undoBtn');
  if(btn) btn.disabled = undoStack.length===0;
}
function undo(){
  if(!undoStack.length) return;
  var snap = JSON.parse(undoStack.pop());
  state.title = snap.title;
  state.address = snap.address;
  state.levels = snap.levels;
  state.activeLevelIndex = Math.min(snap.activeLevelIndex||0, snap.levels.length-1);
  state.columnVisibility = snap.columnVisibility;
  state.customColumns = snap.customColumns;
  state.defaultWindowOperation = snap.defaultWindowOperation || 'Double Hung';
  ui.selectedOpeningId = null;
  ui.selectedLabelId = null;
  setMode('move');
  populateLevelSelect();
  updateTitleField();
  if(window.updateWindowDefaultBadge) window.updateWindowDefaultBadge();
  refreshSvg();
  buildScheduleIfActive();
  lastStableSnapshot = JSON.stringify(state);
  updateUndoButton();
  if(saveTimer) clearTimeout(saveTimer);
  doSave();
  toast('Undone');
}
function setSaveIndicator(text){
  var el = document.getElementById('saveIndicator');
  if(el) el.textContent = text;
}
function loadState(cb){
  try{
    persistGet(SAVE_KEY).then(function(res){
      if(res && res.value){
        try{ applyLoadedState(JSON.parse(res.value)); }catch(e){}
      }
      cb();
    }).catch(function(){ cb(); });
  }catch(e){ cb(); }
}
function migrateOpeningToV3(o){
  if(!o.photos) o.photos = {interior:null, exterior:null};
  if(!o.photoKeys) o.photoKeys = {interior:null, exterior:null};
  if(o.operation !== undefined) return o; // already current format
  if(o.type==='window'){
    var map = {fixed:'Fixed', doubleHung:'Double Hung', casement:'Casement'};
    o.operation = map[o.subtype] || 'Fixed';
  } else {
    o.operation = 'Door'; // pre-existing doors were always plain operable doors
  }
  delete o.subtype;
  if(!o.cells) o.cells = {};
  o.cells.operation = o.operation;
  if(o.cells.size !== undefined){ o.cells.width = o.cells.size; delete o.cells.size; }
  if(o.type==='door'){
    var hs = o.hingeSide || 'p1', so = !!o.swingOut;
    var match = SWING_OPTIONS.filter(function(s){ return s.hingeSide===hs && s.swingOut===so; })[0];
    o.cells.swing = match ? match.label : 'Inswing, Left';
  }
  delete o.cells.style;
  o.noWork = !!o.noWork;
  return o;
}

function applyLoadedState(parsed){
  if(!parsed) return;
  state.title = parsed.title || state.title;
  state.address = parsed.address || '';
  state.defaultWindowOperation = parsed.defaultWindowOperation || 'Double Hung';
  state.planId = parsed.planId || state.planId || null;
  state.status = parsed.status || state.status || 'Draft';
  state.lastEditedAt = parsed.lastEditedAt || null;

  if(parsed.columnVisibility){
    state.columnVisibility = parsed.columnVisibility;
    state.customColumns = parsed.customColumns || [];
  } else if(parsed.columns){
    // Older flat-column format: recover any non-preset entries as custom columns,
    // visibility resets to sensible defaults since the old shape had no show/hide concept.
    // 'style' and 'size' are old preset keys whose data already gets migrated into the new
    // operation/swing/width fields below - they must NOT be kept as leftover custom columns.
    state.columnVisibility = defaultColumnVisibility();
    var presetKeys = presetColumnDefs().map(function(c){ return c.key; });
    var retiredKeys = ['style','size'];
    state.customColumns = parsed.columns.filter(function(c){
      return presetKeys.indexOf(c.key)<0 && retiredKeys.indexOf(c.key)<0;
    });
  } else {
    state.columnVisibility = defaultColumnVisibility();
    state.customColumns = [];
  }

  function migrateLevel(lvl){
    (lvl.openings||[]).forEach(migrateOpeningToV3);
    if(!lvl.labels) lvl.labels = [];
    if(!lvl.interiorLines) lvl.interiorLines = [];
    if(!lvl.locks) lvl.locks = {walls:false, openings:false};
    return lvl;
  }

  if(parsed.levels && parsed.levels.length){
    state.levels = parsed.levels.map(migrateLevel);
    state.activeLevelIndex = Math.min(parsed.activeLevelIndex||0, parsed.levels.length-1);
  } else if(parsed.vertices && parsed.vertices.length){
    // backward compatibility with single-level saved files
    state.levels = [migrateLevel({
      id: nextId(), name:'Level 1',
      vertices: parsed.vertices, openings: parsed.openings||[]
    })];
    state.activeLevelIndex = 0;
  }
}

/* ============================== TOAST ============================== */
var toastTimer=null;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

/* ============================== CUSTOM DIALOGS ==============================
   The artifact sandbox appears to silently swallow native confirm()/prompt().
   These build the same interaction ourselves so it can never be blocked. */
function closeDialog(){
  var ov = document.getElementById('dialogOverlay');
  if(ov) ov.remove();
}

// Shows a photo full-size right on the page, rather than window.open() - which we already
// confirmed opens a blank, unusable page in this app's embedded browser context (same failure
// mode as the earlier PDF-preview issue). Tap anywhere to close.
function showPhotoViewer(dataUrl){
  var existing = document.getElementById('photoViewerOverlay');
  if(existing) existing.remove();
  var ov = document.createElement('div');
  ov.id = 'photoViewerOverlay';
  var img = document.createElement('img');
  img.src = dataUrl;
  ov.appendChild(img);
  ov.addEventListener('click', function(){ ov.remove(); });
  document.body.appendChild(ov);
}

function showConfirmDialog(opts){
  closeDialog();
  var ov = document.createElement('div'); ov.id='dialogOverlay';
  var card = document.createElement('div'); card.id='dialogCard';
  var h3 = document.createElement('h3'); h3.textContent = opts.title || 'Are you sure?';
  var p = document.createElement('p'); p.textContent = opts.message || '';
  var btns = document.createElement('div'); btns.id='dialogButtons';
  var cancelBtn = document.createElement('button');
  cancelBtn.className='dialogCancelBtn'; cancelBtn.textContent = opts.cancelLabel || 'Cancel';
  cancelBtn.addEventListener('click', closeDialog);
  var okBtn = document.createElement('button');
  okBtn.className = opts.danger ? 'dialogOkBtn dialogDangerBtn' : 'dialogOkBtn';
  okBtn.textContent = opts.okLabel || 'OK';
  okBtn.addEventListener('click', function(){ closeDialog(); if(opts.onConfirm) opts.onConfirm(); });
  btns.appendChild(cancelBtn); btns.appendChild(okBtn);
  card.appendChild(h3); if(opts.message) card.appendChild(p); card.appendChild(btns);
  ov.appendChild(card);
  ov.addEventListener('click', function(ev){ if(ev.target===ov) closeDialog(); });
  document.body.appendChild(ov);
}

function showPromptDialog(opts){
  closeDialog();
  var ov = document.createElement('div'); ov.id='dialogOverlay';
  var card = document.createElement('div'); card.id='dialogCard';
  var h3 = document.createElement('h3'); h3.textContent = opts.title || '';
  var input = document.createElement('input');
  input.type='text'; input.value = opts.defaultValue || ''; input.placeholder = opts.placeholder || '';
  var btns = document.createElement('div'); btns.id='dialogButtons';
  var cancelBtn = document.createElement('button');
  cancelBtn.className='dialogCancelBtn'; cancelBtn.textContent='Cancel';
  cancelBtn.addEventListener('click', closeDialog);
  var okBtn = document.createElement('button');
  okBtn.className='dialogOkBtn'; okBtn.textContent = opts.okLabel || 'OK';
  function submit(){
    var val = input.value;
    closeDialog();
    if(opts.onSubmit) opts.onSubmit(val);
  }
  okBtn.addEventListener('click', submit);
  input.addEventListener('keydown', function(ev){ if(ev.key==='Enter') submit(); });
  btns.appendChild(cancelBtn); btns.appendChild(okBtn);
  card.appendChild(h3); card.appendChild(input); card.appendChild(btns);
  ov.appendChild(card);
  ov.addEventListener('click', function(ev){ if(ev.target===ov) closeDialog(); });
  document.body.appendChild(ov);
  setTimeout(function(){ input.focus(); input.select(); }, 30);
}

/* ============================== SVG BUILD ============================== */
var svgNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  var el = document.createElementNS(svgNS, tag);
  for(var k in attrs){ el.setAttribute(k, attrs[k]); }
  return el;
}

var viewState = { zoom: 1, vx: null, vy: null }; // vx/vy null = not yet manually positioned (auto-fit)
var MIN_ZOOM = 1, MAX_ZOOM = 6;
function clampZoom(z){ return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z)); }
function resetView(){ viewState.zoom = 1; viewState.vx = null; viewState.vy = null; }

/* ---- Focus-mode zoom anchor -----------------------------------------------------------
   Selecting an opening/label/interior item hides the header/tabs/toolbar (focus mode), which
   changes the canvas container's size and, since the SVG viewBox is fit-and-centered to that
   container, used to cause the whole plan to visibly reflow at the exact moment of selection.
   Instead of leaving the full plan visible through that resize, we deliberately zoom in on the
   selected item (reusing the same viewState the pinch-zoom/+/- buttons already drive) so the
   transition reads as "zooming in on what you tapped" rather than an unrelated layout jump.
   The view from before entering focus mode is restored exactly on exit. */
var FOCUS_ZOOM = 1.3; // conservative - matches one tap of the existing +/- zoom buttons
var preFocusViewState = null;
function applyFocusZoom(anchorX, anchorY){
  var lvl = currentLevel();
  var bb = boundingBox(lvl.vertices);
  var pad = 70;
  var baseVw = (bb.maxX-bb.minX)+pad*2, baseVh = (bb.maxY-bb.minY)+pad*2;
  var targetZoom = clampZoom(Math.max(viewState.zoom, FOCUS_ZOOM)); // never zoom OUT to get here
  var vw = baseVw/targetZoom, vh = baseVh/targetZoom;
  viewState.zoom = targetZoom;
  viewState.vx = anchorX - vw/2;
  viewState.vy = anchorY - vh/2;
}
function enterFocusZoom(anchorX, anchorY){
  if(preFocusViewState===null){
    preFocusViewState = { zoom: viewState.zoom, vx: viewState.vx, vy: viewState.vy };
  }
  applyFocusZoom(anchorX, anchorY);
}
function exitFocusZoom(){
  if(preFocusViewState){
    viewState.zoom = preFocusViewState.zoom;
    viewState.vx = preFocusViewState.vx;
    viewState.vy = preFocusViewState.vy;
    preFocusViewState = null;
  }
}

/* ---- Slow edge auto-pan during a drag --------------------------------------------------
   When zoomed in (focus mode or manual pinch/zoom), dragging a window/door toward the edge
   of the visible view used to just run out of canvas - nothing followed your finger. While a
   drag is active and the pointer sits near the edge of #planSvg, this slowly pans the view in
   that direction so the item stays reachable, then re-runs the drag's own position math
   against the new (panned) view so the dragged item keeps tracking the pointer smoothly.
   Deliberately gentle per Nathan's ask - this is a following-nudge, not a fast auto-scroll. */
var EDGE_PAN_MARGIN = 36;   // px from the canvas edge that triggers panning
var EDGE_PAN_SPEED = 140;   // viewBox units/second at the current zoom - kept slow on purpose
var edgePanRAF = null, edgePanLastTime = null, edgePanClient = null, edgePanReposition = null;
function edgePanTick(now){
  if(!edgePanClient){ edgePanRAF = null; edgePanLastTime = null; return; }
  var svg = document.getElementById('planSvg');
  var rect = svg.getBoundingClientRect();
  var dt = edgePanLastTime ? Math.min((now-edgePanLastTime)/1000, 0.1) : 0;
  edgePanLastTime = now;
  if(rect.width && rect.height && dt > 0){
    var dxN = 0, dyN = 0;
    if(edgePanClient.x < rect.left+EDGE_PAN_MARGIN) dxN = -1;
    else if(edgePanClient.x > rect.right-EDGE_PAN_MARGIN) dxN = 1;
    if(edgePanClient.y < rect.top+EDGE_PAN_MARGIN) dyN = -1;
    else if(edgePanClient.y > rect.bottom-EDGE_PAN_MARGIN) dyN = 1;
    if(dxN || dyN){
      var vb = computeViewBox(currentLevel(), false);
      var scaleX = vb.vw/rect.width, scaleY = vb.vh/rect.height;
      viewState.zoom = clampZoom(viewState.zoom); // ensure it's a real, positioned view
      viewState.vx = vb.vx + dxN*EDGE_PAN_SPEED*scaleX*dt;
      viewState.vy = vb.vy + dyN*EDGE_PAN_SPEED*scaleY*dt;
      if(edgePanReposition) edgePanReposition();
    }
  }
  edgePanRAF = requestAnimationFrame(edgePanTick);
}
function startEdgePan(reposition){
  edgePanReposition = reposition;
  if(!edgePanRAF){ edgePanLastTime = null; edgePanRAF = requestAnimationFrame(edgePanTick); }
}
function updateEdgePanPoint(clientX, clientY){ edgePanClient = {x:clientX, y:clientY}; }
function stopEdgePan(){
  edgePanClient = null; edgePanReposition = null;
  if(edgePanRAF){ cancelAnimationFrame(edgePanRAF); edgePanRAF = null; }
  edgePanLastTime = null;
}

function computeViewBox(lvl, printMode){
  var bb = boundingBox(lvl.vertices);
  var pad = 70;
  var base = { vx: bb.minX-pad, vy: bb.minY-pad, vw: (bb.maxX-bb.minX)+pad*2, vh: (bb.maxY-bb.minY)+pad*2 };
  if(printMode || viewState.zoom <= 1.001 || viewState.vx===null){
    if(!printMode && viewState.zoom > 1.001 && viewState.vx===null){
      // First zoom-in (e.g. via the + button, no pinch anchor yet) - center on the plan itself.
      var vw = base.vw/viewState.zoom, vh = base.vh/viewState.zoom;
      return { vx: base.vx+base.vw/2-vw/2, vy: base.vy+base.vh/2-vh/2, vw: vw, vh: vh };
    }
    return base;
  }
  var vw2 = base.vw/viewState.zoom, vh2 = base.vh/viewState.zoom;
  return { vx: viewState.vx, vy: viewState.vy, vw: vw2, vh: vh2 };
}

function buildSvg(target, lvl, opts){
  opts = opts || {};
  var verts = lvl.vertices;
  var vb = computeViewBox(lvl, opts.printMode);
  var vx = vb.vx, vy = vb.vy, vw = vb.vw, vh = vb.vh;
  target.setAttribute('viewBox', vx+' '+vy+' '+vw+' '+vh);
  while(target.firstChild) target.removeChild(target.firstChild);

  var gridG = svgEl('g', {});
  var gEndX = vx+vw, gEndY = vy+vh;
  for(var gx=Math.floor(vx/40)*40; gx<gEndX; gx+=40){
    gridG.appendChild(svgEl('line',{x1:gx,y1:vy,x2:gx,y2:gEndY,stroke:'#eeece3','stroke-width':1}));
  }
  for(var gy=Math.floor(vy/40)*40; gy<gEndY; gy+=40){
    gridG.appendChild(svgEl('line',{x1:vx,y1:gy,x2:gEndX,y2:gy,stroke:'#eeece3','stroke-width':1}));
  }
  target.appendChild(gridG);

  var eArr = edges(verts);
  var cw = isClockwiseSvg(verts);

  var wallsG = svgEl('g', {});
  eArr.forEach(function(e){
    var g = svgEl('g', {'data-role':'wall', 'data-index':e.index});
    g.appendChild(svgEl('line',{x1:e.v1.x,y1:e.v1.y,x2:e.v2.x,y2:e.v2.y,stroke:'transparent','stroke-width':30,'stroke-linecap':'square'}));
    g.appendChild(svgEl('line',{x1:e.v1.x,y1:e.v1.y,x2:e.v2.x,y2:e.v2.y,stroke:'var(--wall)','stroke-width':WALL_T,'stroke-linecap':'square'}));
    wallsG.appendChild(g);
  });
  target.appendChild(wallsG);

  // Interior reference lines/rectangles: thin, non-structural marks used purely to note
  // interior wall locations. No openings ever go on these - deliberately dumb objects.
  var INTERIOR_STROKE = 5;
  var interiorG = svgEl('g', {});
  (lvl.interiorLines||[]).forEach(function(il){
    var isSel = il.id===ui.selectedInteriorId && !opts.printMode;
    if(il.kind==='rect'){
      var rx = Math.min(il.x1,il.x2), ry = Math.min(il.y1,il.y2);
      var rw = Math.abs(il.x2-il.x1), rh = Math.abs(il.y2-il.y1);
      var g = svgEl('g', {'data-role':'interior', 'data-id':il.id});
      if(isSel){
        g.appendChild(svgEl('rect',{x:rx-3,y:ry-3,width:rw+6,height:rh+6, fill:'none', stroke:'var(--accent)','stroke-width':6,opacity:0.35}));
      }
      g.appendChild(svgEl('rect',{x:rx,y:ry,width:rw,height:rh, fill:'none', stroke:'transparent','stroke-width':20}));
      g.appendChild(svgEl('rect',{x:rx,y:ry,width:rw,height:rh, fill:'none', stroke:'var(--wall)','stroke-width':INTERIOR_STROKE}));
      interiorG.appendChild(g);
    } else {
      var g2 = svgEl('g', {'data-role':'interior', 'data-id':il.id});
      if(isSel){
        g2.appendChild(svgEl('line',{x1:il.x1,y1:il.y1,x2:il.x2,y2:il.y2, stroke:'var(--accent)','stroke-width':INTERIOR_STROKE+8,'stroke-linecap':'round',opacity:0.35}));
      }
      g2.appendChild(svgEl('line',{x1:il.x1,y1:il.y1,x2:il.x2,y2:il.y2, stroke:'transparent','stroke-width':20,'stroke-linecap':'round'}));
      g2.appendChild(svgEl('line',{x1:il.x1,y1:il.y1,x2:il.x2,y2:il.y2, stroke:'var(--wall)','stroke-width':INTERIOR_STROKE,'stroke-linecap':'round'}));
      interiorG.appendChild(g2);
    }
  });
  if(ui.drawPreview && !opts.printMode){
    var pv = ui.drawPreview;
    if(pv.kind==='rect'){
      var px = Math.min(pv.x1,pv.x2), py = Math.min(pv.y1,pv.y2);
      var pw = Math.abs(pv.x2-pv.x1), ph = Math.abs(pv.y2-pv.y1);
      interiorG.appendChild(svgEl('rect',{x:px,y:py,width:pw,height:ph, fill:'none', stroke:'var(--accent)','stroke-width':3,'stroke-dasharray':'6 4'}));
    } else {
      interiorG.appendChild(svgEl('line',{x1:pv.x1,y1:pv.y1,x2:pv.x2,y2:pv.y2, stroke:'var(--accent)','stroke-width':3,'stroke-dasharray':'6 4','stroke-linecap':'round'}));
    }
  }
  target.appendChild(interiorG);

  // flush joint markers (only shown while the two sides are still perfectly aligned)
  if(!opts.printMode){
    var jointsG = svgEl('g', {});
    var seen = {};
    verts.forEach(function(v){
      if(!v.joint || seen[v.jointId]) return;
      var partner = verts.find(function(x){ return x!==v && x.jointId===v.jointId; });
      if(!partner) return;
      seen[v.jointId] = true;
      if(v.x===partner.x && v.y===partner.y){
        var hitHalf = 22; // generous tap target - much bigger than the visible marker itself
        var visHalf = 10;
        var jg = svgEl('g', {'data-role':'jointMarker', 'data-vid':v.id});
        jg.appendChild(svgEl('rect',{x:v.x-hitHalf, y:v.y-hitHalf, width:hitHalf*2, height:hitHalf*2, fill:'transparent'}));
        jg.appendChild(svgEl('rect',{
          x:v.x-visHalf, y:v.y-visHalf, width:visHalf*2, height:visHalf*2,
          fill:'var(--paper)', stroke:'var(--ink)', 'stroke-width':2
        }));
        jointsG.appendChild(jg);
      }
    });
    target.appendChild(jointsG);
  }

  var eByKey = {};
  eArr.forEach(function(e){ eByKey[e.key]=e; });
  var openG = svgEl('g', {});
  var badgeGroups = [];
  var selectionGroups = [];
  lvl.openings.forEach(function(o){
    var e = eByKey[o.wallKey];
    if(!e) return;
    var p1 = pointAt(e, o.offset);
    var p2 = pointAt(e, o.offset+o.width);
    var ux = (e.v2.x-e.v1.x)/e.len, uy=(e.v2.y-e.v1.y)/e.len;
    var nx = -uy, ny = ux;
    var outN = outwardNormalForEdge(e.v1,e.v2,cw);

    var g = svgEl('g', {'data-role':'opening','data-id':o.id,'data-type':o.type});

    var half = WALL_T/2+2;
    var rectPts = [
      {x:p1.x+nx*half, y:p1.y+ny*half},
      {x:p2.x+nx*half, y:p2.y+ny*half},
      {x:p2.x-nx*half, y:p2.y-ny*half},
      {x:p1.x-nx*half, y:p1.y-ny*half}
    ];
    g.appendChild(svgEl('polygon',{points:rectPts.map(function(p){return p.x+','+p.y;}).join(' '), fill:'var(--paper)'}));
    g.appendChild(svgEl('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:'transparent','stroke-width':26}));

    var NO_WORK_GRAY = '#9a9488';
    var typeColor = o.noWork ? NO_WORK_GRAY : (o.type==='window' ? 'var(--window)' : 'var(--door)');

    // Badges normally sit on the exterior side of the wall. Doors with an actual swing leaf
    // override this below to sit on the opposite side from the swing arc, so the badge can
    // never collide with the arc/leaf it's labeling regardless of hinge side or in/out.
    var badgeNormal = outN;

    if(o.type==='window'){
      [-4,4].forEach(function(off){
        g.appendChild(svgEl('line',{
          x1:p1.x+nx*off, y1:p1.y+ny*off, x2:p2.x+nx*off, y2:p2.y+ny*off,
          stroke:typeColor, 'stroke-width':4, 'stroke-linecap':'round'
        }));
      });
      [p1,p2].forEach(function(p){
        g.appendChild(svgEl('line',{x1:p.x-nx*half,y1:p.y-ny*half,x2:p.x+nx*half,y2:p.y+ny*half,stroke:'var(--wall)','stroke-width':3}));
      });
      // Fixed, Hopper, Awning, French Pair, and Other all render like a plain fixed window - no clutter.
      if(o.operation==='Double Hung'){
        var mid = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
        g.appendChild(svgEl('line',{x1:mid.x-nx*5,y1:mid.y-ny*5,x2:mid.x+nx*5,y2:mid.y+ny*5,stroke:typeColor,'stroke-width':2.5}));
      } else if(o.operation==='Casement'){
        g.appendChild(svgEl('line',{x1:p1.x-nx*4,y1:p1.y-ny*4,x2:p2.x+nx*4,y2:p2.y+ny*4,stroke:typeColor,'stroke-width':2, 'stroke-dasharray':'3 2'}));
      }
    } else if(o.operation==='Fixed' || o.operation==='Sidelite'){
      // Non-operating door panel: a single centerline, jamb ticks, no leaf or swing arc.
      [p1,p2].forEach(function(p){
        g.appendChild(svgEl('line',{x1:p.x-nx*half,y1:p.y-ny*half,x2:p.x+nx*half,y2:p.y+ny*half,stroke:'var(--wall)','stroke-width':3}));
      });
      g.appendChild(svgEl('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:typeColor,'stroke-width':4}));
    } else {
      [p1,p2].forEach(function(p){
        g.appendChild(svgEl('line',{x1:p.x-nx*half,y1:p.y-ny*half,x2:p.x+nx*half,y2:p.y+ny*half,stroke:'var(--wall)','stroke-width':3}));
      });
      // Hinge side ('p1' or 'p2') and swing direction (in/out) are independently selectable -
      // 4 combinations total. Defaults (p1, inswing) match the original hardcoded behavior,
      // so previously-saved doors render identically unless the person changes them.
      var hingeSide = o.hingeSide || 'p1';
      var swingOut = !!o.swingOut;
      var hinge = hingeSide==='p2' ? p2 : p1;
      var far = hingeSide==='p2' ? p1 : p2;
      var swingVec = swingOut ? outN : {x:-outN.x, y:-outN.y};
      badgeNormal = {x:-swingVec.x, y:-swingVec.y};
      var leafEnd = {x:hinge.x+swingVec.x*o.width, y:hinge.y+swingVec.y*o.width};
      g.appendChild(svgEl('line',{x1:hinge.x,y1:hinge.y,x2:leafEnd.x,y2:leafEnd.y,stroke:typeColor,'stroke-width':3}));
      var v1x = leafEnd.x-hinge.x, v1y = leafEnd.y-hinge.y;
      var v2x = far.x-hinge.x, v2y = far.y-hinge.y;
      var cross = v1x*v2y - v1y*v2x;
      var sweep = cross >= 0 ? 1 : 0;
      var pathD = 'M '+leafEnd.x+' '+leafEnd.y+' A '+o.width+' '+o.width+' 0 0 '+sweep+' '+far.x+' '+far.y;
      g.appendChild(svgEl('path',{d:pathD, fill:'none', stroke:typeColor, 'stroke-width':2, 'stroke-dasharray':'4 3'}));
    }

    var mid2 = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
    var badgeCenter = {x:mid2.x+badgeNormal.x*20, y:mid2.y+badgeNormal.y*20};
    var pairSuffix = o.pairRole==='active' ? 'A' : (o.pairRole==='passive' ? 'P' : '');
    var badgeText = (o.type==='window'?'W':'D') + o.num + pairSuffix;
    // Sized to comfortably fit the longest possible label (4 chars, e.g. "W22P") without
    // scaling per-label - keeps every badge the same visual size regardless of content.
    var BADGE_R = 15, BADGE_FONT = 10.5;
    var badge = svgEl('g', {'data-role':'opening','data-id':o.id,'data-type':o.type});
    badge.appendChild(svgEl('circle',{cx:badgeCenter.x, cy:badgeCenter.y, r:BADGE_R, fill: typeColor}));
    var txt = svgEl('text',{x:badgeCenter.x, y:badgeCenter.y+4, 'text-anchor':'middle','font-size':BADGE_FONT,'font-weight':800,fill:'#fff'});
