    txt.textContent = badgeText;
    badge.appendChild(txt);
    badgeGroups.push(badge);

    if(o.id === ui.selectedOpeningId && !opts.printMode){
      var selG = svgEl('g', {});
      // Purely decorative highlight wash - pointer-events:none so a tap here falls through to
      // the opening's own move-hit-target underneath, instead of hitting this shape (which has
      // no data-role) and silently deselecting. Moving is by far the most common interaction,
      // so it should never compete with anything on top of it.
      selG.appendChild(svgEl('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:'var(--accent)','stroke-width':WALL_T+6,'stroke-linecap':'round',opacity:0.35,'pointer-events':'none'}));
      // Resize handles are pushed just past the opening's actual ends (not sitting on top of
      // them) and made smaller - resizing is rare and can afford to take a little precision;
      // moving/dragging along the wall should stay frictionless and never land on a handle.
      var HANDLE_OFFSET = 8, HANDLE_R = 7;
      [{p:p1, dx:-ux, dy:-uy, end:'start'},{p:p2, dx:ux, dy:uy, end:'end'}].forEach(function(h){
        var hx = h.p.x + h.dx*HANDLE_OFFSET, hy = h.p.y + h.dy*HANDLE_OFFSET;
        selG.appendChild(svgEl('circle',{cx:hx, cy:hy, r:HANDLE_R, fill:'var(--accent)', stroke:'#fff','stroke-width':2,'data-role':'handle','data-id':o.id,'data-end':h.end}));
      });
      selectionGroups.push(selG);
    }

    openG.appendChild(g);
  });
  // Badges and selection highlights are layered globally AFTER every opening's geometry, so a
  // badge or handle can never paint over another opening's swing arc/leaf just because it
  // happened to come later in the openings array - z-order is now grouped by layer, not per-opening.
  badgeGroups.forEach(function(bg){ openG.appendChild(bg); });
  selectionGroups.forEach(function(sg){ openG.appendChild(sg); });
  target.appendChild(openG);

  var labelsG = svgEl('g', {});
  (lvl.labels||[]).forEach(function(lab){
    var size = lab.size || 16;
    var hitW = Math.max(40, lab.text.length*size*0.62);
    var hitH = size*1.8;
    var lg = svgEl('g', {'data-role':'label', 'data-id':lab.id});
    if(lab.id===ui.selectedLabelId && !opts.printMode){
      lg.appendChild(svgEl('rect',{
        x:lab.x-hitW/2, y:lab.y-hitH/2, width:hitW, height:hitH, rx:4,
        fill:'none', stroke:'var(--accent)', 'stroke-width':2, 'stroke-dasharray':'4 3'
      }));
    }
    lg.appendChild(svgEl('rect',{x:lab.x-hitW/2, y:lab.y-hitH/2, width:hitW, height:hitH, fill:'transparent'}));
    var txt = svgEl('text',{
      x:lab.x, y:lab.y+size*0.32, 'text-anchor':'middle', 'font-size':size,
      'font-weight':700, fill:'var(--ink)'
    });
    txt.textContent = lab.text;
    lg.appendChild(txt);
    labelsG.appendChild(lg);
  });
  target.appendChild(labelsG);
}

function refreshSvg(){
  buildSvg(document.getElementById('planSvg'), currentLevel(), {});
}

/* ============================== SCHEDULE BUILD ============================== */
function sortedOpenings(list){
  return list.slice().sort(function(a,b){
    if(a.type!==b.type) return a.type==='window'?-1:1;
    return a.num-b.num;
  });
}

function buildSchedule(){
  var table = document.getElementById('sched');
  var empty = document.getElementById('emptySched');
  while(table.firstChild) table.removeChild(table.firstChild);

  var cols = allColumnsForDisplay();

  var thead = document.createElement('thead');
  var htr = document.createElement('tr');
  cols.forEach(function(col){
    var th = document.createElement('th');
    var isCustom = !col.kind;
    if(isCustom){
      th.contentEditable = 'true';
      th.spellcheck = false;
      th.textContent = col.label;
      th.addEventListener('input', function(){ col.label = th.textContent; scheduleSave(); });
      var del = document.createElement('span');
      del.className='colDelBtn'; del.textContent=' \u2715'; del.title='Remove column';
      del.addEventListener('click', function(ev){
        ev.stopPropagation();
        state.customColumns = state.customColumns.filter(function(c){ return c.key!==col.key; });
        buildSchedule(); updateInlinePanel(); scheduleSave();
      });
      th.appendChild(del);
    } else {
      th.textContent = col.label;
    }
    htr.appendChild(th);
  });
  var photosTh = document.createElement('th'); photosTh.textContent='Photos'; photosTh.style.width='90px';
  htr.appendChild(photosTh);
  var jumpTh = document.createElement('th'); jumpTh.style.width='52px';
  htr.appendChild(jumpTh);
  var addColTh = document.createElement('th'); addColTh.style.width='46px';
  var addColBtn = document.createElement('button');
  addColBtn.type='button'; addColBtn.className='addColHeaderBtn'; addColBtn.textContent='+';
  addColBtn.title = 'Add column';
  addColBtn.addEventListener('click', function(){
    var key = 'col_'+Date.now();
    state.customColumns.push({key:key, label:'New Column'});
    buildSchedule(); updateInlinePanel(); scheduleSave();
  });
  addColTh.appendChild(addColBtn);
  htr.appendChild(addColTh);
  thead.appendChild(htr);
  table.appendChild(thead);

  var tbody = document.createElement('tbody');
  var totalRows = 0;
  var showLevelHeaders = state.levels.length > 1;

  state.levels.forEach(function(lvl, li){
    var rows = sortedOpenings(lvl.openings);
    if(rows.length===0) return;
    totalRows += rows.length;

    if(showLevelHeaders){
      var htr2 = document.createElement('tr');
      htr2.className='levelHeaderRow';
      var td2 = document.createElement('td');
      td2.colSpan = cols.length+3;
      td2.textContent = lvl.name;
      htr2.appendChild(td2);
      tbody.appendChild(htr2);
    }

    rows.forEach(function(o){
      var tr = document.createElement('tr');
      tr.className = 'rowType-'+o.type + (o.noWork ? ' rowNoWork' : '');
      cols.forEach(function(col){
        var td = document.createElement('td');
        var locked = !!o.noWork || col.kind==='locked';

        if(col.key==='swing' && o.type==='door'){
          var swingSel = document.createElement('select');
          swingSel.disabled = locked;
          SWING_OPTIONS.forEach(function(opt){
            var oEl = document.createElement('option');
            oEl.value = opt.label; oEl.textContent = opt.label;
            if((o.hingeSide||'p1')===opt.hingeSide && !!o.swingOut===opt.swingOut) oEl.selected = true;
            swingSel.appendChild(oEl);
          });
          swingSel.addEventListener('change', function(){
            var match = SWING_OPTIONS.filter(function(s){ return s.label===swingSel.value; })[0];
            if(match){ o.hingeSide = match.hingeSide; o.swingOut = match.swingOut; if(!o.cells) o.cells={}; o.cells.swing = match.label; }
            if(li===state.activeLevelIndex){ refreshSvg(); updateInlinePanel(); }
            scheduleSave();
          });
          td.appendChild(swingSel);
        } else if(col.key==='swing' && o.type==='window' && o.operation==='Casement'){
          var casSel = document.createElement('select');
          casSel.disabled = locked;
          CASEMENT_SWING_OPTIONS.forEach(function(opt){
            var oEl = document.createElement('option');
            oEl.value = opt.value; oEl.textContent = opt.label;
            if((o.casementSwing||'out')===opt.value) oEl.selected = true;
            casSel.appendChild(oEl);
          });
          casSel.addEventListener('change', function(){
            o.casementSwing = casSel.value;
            if(!o.cells) o.cells={};
            o.cells.swing = casSel.value==='out' ? 'Outswing' : 'Inswing';
            if(li===state.activeLevelIndex){ refreshSvg(); updateInlinePanel(); }
            scheduleSave();
          });
          td.appendChild(casSel);
        } else if(col.key==='swing'){
          td.textContent = '';
        } else if(col.kind==='checkbox'){
          var chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.disabled = locked;
          chk.checked = !!(o.cells && o.cells[col.key]);
          chk.addEventListener('change', function(){
            if(!o.cells) o.cells = {};
            o.cells[col.key] = chk.checked;
            scheduleSave();
          });
          td.style.textAlign = 'center';
          td.appendChild(chk);
        } else if(col.kind==='dropdown'){
          var options = col.optionsFor(o.type);
          var sel = document.createElement('select');
          sel.disabled = locked;
          var isOtherFlag = o.cells && o.cells[col.key+'IsOther'];
          options.forEach(function(optText){
            var oEl = document.createElement('option');
            oEl.value = optText; oEl.textContent = optText;
            if(isOtherFlag ? optText==='Other' : (o.cells && o.cells[col.key]===optText)) oEl.selected = true;
            sel.appendChild(oEl);
          });
          sel.addEventListener('change', function(){
            if(!o.cells) o.cells = {};
            if(sel.value==='French Pair'){
              var activeLeaf = convertToFrenchPair(o);
              ui.selectedOpeningId = activeLeaf.id;
              if(li===state.activeLevelIndex) refreshSvg();
              updateInlinePanel(); buildSchedule(); scheduleSave();
              return;
            }
            if(sel.value==='Other'){
              o.cells[col.key+'IsOther'] = true;
              o.cells[col.key] = o.cells[col.key+'Text'] || '';
            } else {
              o.cells[col.key+'IsOther'] = false;
              o.cells[col.key] = sel.value;
              if(col.key==='operation'){ o.operation = sel.value; if(sel.value==='Casement' && !o.casementSwing){ o.casementSwing='out'; if(!o.cells) o.cells={}; o.cells.swing='Outswing'; } }
            }
            if(li===state.activeLevelIndex) refreshSvg();
            updateInlinePanel(); buildSchedule(); scheduleSave();
          });
          td.appendChild(sel);
          if(isOtherFlag){
            var otherInp = document.createElement('input');
            otherInp.type='text'; otherInp.placeholder='Describe it'; otherInp.style.marginTop='4px'; otherInp.style.width='100%';
            otherInp.disabled = locked;
            otherInp.value = o.cells[col.key] || '';
            otherInp.addEventListener('input', function(){
              o.cells[col.key] = otherInp.value;
              o.cells[col.key+'Text'] = otherInp.value;
              scheduleSave();
            });
            td.appendChild(otherInp);
          }
        } else {
          td.contentEditable = locked ? 'false' : 'true';
          td.spellcheck=false;
          td.textContent = o.cells && o.cells[col.key]!==undefined ? o.cells[col.key] : '';
          td.addEventListener('input', function(){
            if(locked) return;
            if(col.key==='label' && td.textContent.length>26){ td.textContent = td.textContent.slice(0,26); }
            if(!o.cells) o.cells={};
            o.cells[col.key] = td.textContent;
            if(col.key==='label' && li===state.activeLevelIndex){ refreshSvg(); updateInlinePanel(); }
            scheduleSave();
          });
        }
        tr.appendChild(td);
      });
      var photosTd = document.createElement('td');
      photosTd.style.display='flex'; photosTd.style.gap='4px';
      ['interior','exterior'].forEach(function(slot){
        var url = o.photos && o.photos[slot];
        if(url){
          var thumb = document.createElement('img');
          thumb.src = url; thumb.style.width='26px'; thumb.style.height='26px';
          thumb.style.objectFit='cover'; thumb.style.borderRadius='4px'; thumb.style.border='1px solid var(--line)';
          thumb.title = slot==='interior' ? 'Interior photo' : 'Exterior photo';
          thumb.addEventListener('click', function(){ showPhotoViewer(url); });
          photosTd.appendChild(thumb);
        }
      });
      tr.appendChild(photosTd);

      var jumpTd = document.createElement('td');
      var jumpBtn = document.createElement('button');
      jumpBtn.className='rowDelBtn'; jumpBtn.style.color='var(--ink)';
      jumpBtn.textContent='\u25a4'; jumpBtn.title='View on plan';
      jumpBtn.addEventListener('click', function(){
        state.activeLevelIndex = li;

/* ============================== OPENING CRUD ============================== */
// Splits a single opening into two 24"-wide linked leaves (Active/Passive), centered on the
// opening's original position. Both share the same number, distinguished by an A/P suffix.
// Swaps which leaf is Active and which is Passive. Purely a relabel - offsets, widths, and
// door hinge assignments are already tied to each leaf's own geometric position (outer edge
// vs shared boundary), not to the role label, so nothing else needs to change.
function swapPairRoles(o){
  var lvl = currentLevel();
  var sibling = lvl.openings.find(function(x){ return x.id!==o.id && x.pairId===o.pairId; });
  if(!sibling) return;
  [o, sibling].forEach(function(m){
    var oldRole = m.pairRole;
    var newRole = oldRole==='active' ? 'passive' : 'active';
    var oldSuffix = oldRole==='active' ? 'A' : 'P';
    var newSuffix = newRole==='active' ? 'A' : 'P';
    var shortPrefix = m.type==='window' ? 'W' : 'D';
    if(m.cells && m.cells.label === (shortPrefix+m.num+oldSuffix)){
      m.cells.label = shortPrefix+m.num+newSuffix;
    }
    m.pairRole = newRole;
  });
}

function convertToFrenchPair(o){
  var lvl = currentLevel();
  var e = edges(lvl.vertices).find(function(x){ return x.key===o.wallKey; });
  if(!e) return;
  var leafWidth = Math.max(MIN_OPENING_W, inchesToUnits(24));
  var totalW = leafWidth*2;
  var center = o.offset + o.width/2;
  var newOffset = center - leafWidth;
  newOffset = snap(Math.max(0, Math.min(e.len-totalW, newOffset)));

  var pairId = nextId();
  var shortPrefix = o.type==='window' ? 'W' : 'D';
  var baseCells = Object.assign({}, o.cells);

  var active = Object.assign({}, o, {
    id: nextId(), pairId: pairId, pairRole: 'active',
    offset: newOffset, width: leafWidth,
    operation: 'French Pair',
    hingeSide: o.type==='door' ? 'p1' : undefined,
    swingOut: o.type==='door' ? false : undefined,
    photos: Object.assign({interior:null, exterior:null}, o.photos),
    photoKeys: Object.assign({interior:null, exterior:null}, o.photoKeys),
    cells: Object.assign({}, baseCells, {label: shortPrefix+o.num+'A', operation:'French Pair', swing: o.type==='door' ? 'Inswing, Left' : ''})
  });
  var passive = Object.assign({}, o, {
    id: nextId(), pairId: pairId, pairRole: 'passive',
    offset: newOffset+leafWidth, width: leafWidth,
    operation: 'French Pair',
    hingeSide: o.type==='door' ? 'p2' : undefined,
    swingOut: o.type==='door' ? false : undefined,
    photos: Object.assign({interior:null, exterior:null}, o.photos),
    photoKeys: Object.assign({interior:null, exterior:null}, o.photoKeys),
    cells: Object.assign({}, baseCells, {label: shortPrefix+o.num+'P', operation:'French Pair', swing: o.type==='door' ? 'Inswing, Right' : ''})
  });

  lvl.openings = lvl.openings.filter(function(x){ return x.id!==o.id; });
  lvl.openings.push(active, passive);
  return active;
}

function nextNumFor(lvl, type){
  var existing = lvl.openings.filter(function(o){ return o.type===type; }).map(function(o){ return o.num; });
  return (existing.length ? Math.max.apply(null, existing) : 0) + 1;
}

  var offset = Math.max(0, Math.min(wallLen-width, along-width/2));

    noWork: false,

    photoKeys: {interior:null, exterior:null},
    cells: {
      label: shortLabel, type: typeName, operation: operation,
      swing: type==='door' ? 'Inswing, Left' : '',
      width:'', height:'', lites:'', screen:'', glass:'', glassNotes:'',

    }

function deleteOpeningFromLevel(li, id){
  var lvl = state.levels[li];

  if(target && target.pairId){
    var sibling = lvl.openings.find(function(o){ return o.id!==id && o.pairId===target.pairId; });
    if(sibling){
      var shortPrefix = sibling.type==='window' ? 'W' : 'D';
      var oldLabel = sibling.cells && sibling.cells.label;
      var wasAutoLabel = oldLabel===(shortPrefix+sibling.num+'A') || oldLabel===(shortPrefix+sibling.num+'P');
      sibling.pairRole = undefined;
      sibling.pairId = undefined;
      sibling.operation = sibling.type==='window' ? 'Casement' : 'Door';
      if(sibling.cells){
        sibling.cells.operation = sibling.operation;
        if(wasAutoLabel) sibling.cells.label = shortPrefix+sibling.num;
      }
    }
  }
  lvl.openings = lvl.openings.filter(function(o){ return o.id!==id; });
  if(ui.selectedOpeningId===id) ui.selectedOpeningId=null;
  if(li===state.activeLevelIndex){ refreshSvg(); updateInlinePanel(); }
  scheduleSave();
}

/* ============================== RENUMBER CLOCKWISE ============================== */
function renumberClockwise(){
  var lvl = currentLevel();
  if(!lvl.openings.length){ toast('Nothing to renumber on this level'); return; }
  var everts = edges(lvl.vertices);
  var starts = {}; var acc=0;
  everts.forEach(function(e){ starts[e.key]=acc; acc+=e.len; });
  var total = acc || 1;
  var cw = isClockwiseSvg(lvl.vertices);

  function clockwiseDist(o){
    var s = starts[o.wallKey];
    if(s===undefined) return 0;
    var fwd = s + o.offset;
    return cw ? fwd : (((total - fwd) % total) + total) % total;
  }

  ['window','door'].forEach(function(type){
    var all = lvl.openings.filter(function(o){ return o.type===type; });
    if(!all.length) return;
    var groups = []; var seenPairIds = {};
    all.forEach(function(o){
      if(o.pairId){
        if(seenPairIds[o.pairId]) return;
        seenPairIds[o.pairId] = true;
        groups.push({ members: all.filter(function(x){ return x.pairId===o.pairId; }), refNum: o.num });
      } else {
        groups.push({ members: [o], refNum: o.num });
      }
    });
    function groupDist(g){ return Math.min.apply(null, g.members.map(clockwiseDist)); }
    var refGroup = groups.reduce(function(min,g){ return g.refNum<min.refNum? g : min; }, groups[0]);
    var refDist = groupDist(refGroup);
    groups.forEach(function(g){ g._rd = (((groupDist(g)-refDist) % total) + total) % total; });
    groups.sort(function(a,b){ return a._rd-b._rd; });
    var shortPrefix = type==='window' ? 'W' : 'D';
    groups.forEach(function(g,i){
      var newNum = i+1;
      g.members.forEach(function(o){
        var suffix = o.pairRole==='active' ? 'A' : (o.pairRole==='passive' ? 'P' : '');
        if(o.cells && o.cells.label === (shortPrefix+o.num+suffix)){
          o.cells.label = shortPrefix+newNum+suffix;
        }
        o.num = newNum;
      });
    });
  });

  refreshSvg();
  buildScheduleIfActive();
  updateInlinePanel();
  scheduleSave();
  toast('Renumbered clockwise');
}

    deleteOpening(o.id); buildScheduleIfActive();
  });
  actionsRow.appendChild(noWorkBtn); actionsRow.appendChild(deleteBtn);
  body.appendChild(actionsRow);
}

/* ============================== POINTER / SVG COORDS ============================== */
function svgPoint(evt){
  var svg = document.getElementById('planSvg');
  var pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  var ctm = svg.getScreenCTM();
  if(!ctm) return {x:0,y:0};
  return pt.matrixTransform(ctm.inverse());
}

function closestPointParam(e, p){
  var ux=(e.v2.x-e.v1.x)/e.len, uy=(e.v2.y-e.v1.y)/e.len;
  var along = (p.x-e.v1.x)*ux + (p.y-e.v1.y)*uy;
  return Math.max(0, Math.min(e.len, along));
}

/* ============================== INTERACTION ============================== */
var activePointers = {};
var pinchState = null;

function pointerCount(){ return Object.keys(activePointers).length; }

function applyZoomWithAnchor(newZoom, anchorSvg, midClient){
  var svg = document.getElementById('planSvg');
  var rect = svg.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  var fx = (midClient.x - rect.left) / rect.width;
  var fy = (midClient.y - rect.top) / rect.height;
  var lvl = currentLevel();
  var bb = boundingBox(lvl.vertices);
  var pad = 70;
  var baseVw = (bb.maxX-bb.minX)+pad*2, baseVh = (bb.maxY-bb.minY)+pad*2;
  var vw = baseVw/newZoom, vh = baseVh/newZoom;
  viewState.zoom = newZoom;
  viewState.vx = anchorSvg.x - fx*vw;
  viewState.vy = anchorSvg.y - fy*vh;
}

function onSvgPointerDown(evt){
  activePointers[evt.pointerId] = {x:evt.clientX, y:evt.clientY};
  var count = pointerCount();

  if(count === 2){
    // Second finger just arrived - interrupt whatever single-finger drag was in progress
    // (wall, opening, handle, or label) and switch to pinch/pan instead.
    if(activeDragCleanup){ activeDragCleanup(); activeDragCleanup = null; }
    var ids = Object.keys(activePointers);
    var p1 = activePointers[ids[0]], p2 = activePointers[ids[1]];
    var dist0 = Math.hypot(p2.x-p1.x, p2.y-p1.y);
    var midClient = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
    var anchorSvg = svgPoint({clientX:midClient.x, clientY:midClient.y});
    pinchState = { startDist: Math.max(dist0, 1), startZoom: viewState.zoom, anchorSvg: anchorSvg };
    return;
  }
  if(count === 1){
    onPointerDown(evt);
  }
  // count > 2: an extra finger beyond the first two - ignore it, the existing pinch (if any) continues.
}

function onSvgPointerMove(evt){
  if(!(evt.pointerId in activePointers)) return;
  activePointers[evt.pointerId] = {x:evt.clientX, y:evt.clientY};
  if(pointerCount() === 2 && pinchState){
    evt.preventDefault();
    var ids = Object.keys(activePointers);
    var p1 = activePointers[ids[0]], p2 = activePointers[ids[1]];
    var dist = Math.hypot(p2.x-p1.x, p2.y-p1.y);
    var newZoom = clampZoom(pinchState.startZoom * (dist/pinchState.startDist));
    var midClient = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
    applyZoomWithAnchor(newZoom, pinchState.anchorSvg, midClient);
    refreshSvg();
  }
}

function onSvgPointerUp(evt){
  delete activePointers[evt.pointerId];
  if(pointerCount() < 2){ pinchState = null; }
}

function initInteraction(){
  var svg = document.getElementById('planSvg');
  svg.addEventListener('pointerdown', onSvgPointerDown);
  window.addEventListener('pointermove', onSvgPointerMove);
  window.addEventListener('pointerup', onSvgPointerUp);
  window.addEventListener('pointercancel', onSvgPointerUp);
}

function onPointerDown(evt){
  var p = svgPoint(evt);
  var lvl = currentLevel();

  if(ui.mode==='addLabel'){
    var lab = addLabel(p.x, p.y);
    ui.selectedOpeningId = null;
    ui.selectedInteriorId = null;
    ui.selectedLabelId = lab.id;
    justPlacedLabelId = lab.id;
    // Stay in this mode so several labels can be placed in a row, matching windows/doors.
    updateInlinePanel(); refreshSvg(); scheduleSave();
    return;
  }

  if(ui.mode==='addInteriorLine' || ui.mode==='addInteriorRect'){
    startInteriorDraw(ui.mode, p);
    return;
  }

  var target = evt.target;
  var handleEl = target.closest('[data-role="handle"]');
  var openingEl = !handleEl ? target.closest('[data-role="opening"]') : null;
  var labelEl = (!handleEl && !openingEl) ? target.closest('[data-role="label"]') : null;
  var interiorEl = (!handleEl && !openingEl && !labelEl) ? target.closest('[data-role="interior"]') : null;
  var jointMarkerEl = (!handleEl && !openingEl && !labelEl && !interiorEl) ? target.closest('[data-role="jointMarker"]') : null;
  var wallEl = (!handleEl && !openingEl && !labelEl && !interiorEl && !jointMarkerEl) ? target.closest('[data-role="wall"]') : null;

  if(handleEl){ startHandleDrag(handleEl.dataset.id, handleEl.dataset.end); return; }

  if(openingEl){
    if(ui.mode!=='move'){ return; }
    ui.selectedLabelId = null;
    ui.selectedOpeningId = openingEl.dataset.id;
    // Selection highlight shows immediately (refreshSvg), but updateInlinePanel() is deferred
    // until the drag ends (see startOpeningMoveDrag's onUp) - it toggles body.focus-mode, which
    // hides the header/tabs/toolbar and reveals the inline panel, resizing the canvas. Doing
    // that synchronously on touch-down caused a visible layout jump right as a drag began.
    refreshSvg();
    startOpeningMoveDrag(openingEl.dataset.id, evt);
    return;
  }

  if(labelEl){
    if(ui.mode!=='move'){ return; }
    ui.selectedOpeningId = null;
    ui.selectedLabelId = labelEl.dataset.id;
    refreshSvg(); // updateInlinePanel() deferred to drag end - see comment above
    startLabelMoveDrag(labelEl.dataset.id, evt);
    return;
  }

  if(interiorEl){
    if(ui.mode!=='move'){ return; }
    ui.selectedOpeningId = null; ui.selectedLabelId = null;
    ui.selectedInteriorId = interiorEl.dataset.id;
    refreshSvg(); // updateInlinePanel() deferred to drag end - see comment above
    startInteriorMoveDrag(interiorEl.dataset.id, evt);
    return;
  }

  var hadSelection = !!(ui.selectedOpeningId || ui.selectedLabelId || ui.selectedInteriorId);

  if(jointMarkerEl){
    if(ui.mode==='addJoint'){
      if(lvl.locks && lvl.locks.walls){ toast('Walls are locked on this level'); return; }
      var res = removeJoint(jointMarkerEl.dataset.vid);
      if(res.ok){ refreshSvg(); scheduleSave(); toast('Joint removed'); }
      else { toast('Push the wall flush before removing this joint'); }
    } else if(hadSelection){
      ui.selectedOpeningId = null; ui.selectedLabelId = null; ui.selectedInteriorId = null;
      updateInlinePanel(); refreshSvg();
    }
    return;
  }

  if(wallEl){
    var idx = parseInt(wallEl.dataset.index, 10);
    var e = edges(lvl.vertices)[idx];

    if(ui.mode==='addWindow' || ui.mode==='addDoor'){
      var along = closestPointParam(e, p);
      addOpening(ui.mode==='addWindow'?'window':'door', e.key, along, e.len);
      // Stay in this mode so several windows/doors can be placed in a row.
      refreshSvg(); buildScheduleIfActive(); scheduleSave();
      return;
    }
    if(ui.mode==='addJoint'){
      if(lvl.locks && lvl.locks.walls){ toast('Walls are locked on this level'); return; }
      var t = closestPointParam(e, p)/e.len;
      var res2 = insertJoint(idx, t);
      // Stay in this mode so several joints can be placed in a row, matching windows/doors.
      if(res2.ok){ refreshSvg(); scheduleSave(); }
      else if(res2.reason==='tooClose'){ toast('Too close to an existing joint \u2014 tap it directly to remove it, or tap farther away to add a new one'); }
      else { toast('That wall is too short for a joint'); }
      return;
    }

    if(hadSelection){
      // Something was focused - this tap just exits focus mode rather than also grabbing
      // the wall, so plan edits always require a deliberate, separate action.
      ui.selectedOpeningId = null; ui.selectedLabelId = null; ui.selectedInteriorId = null;
      updateInlinePanel(); refreshSvg();
      return;
    }
    if(lvl.locks && lvl.locks.walls){ toast('Walls are locked on this level'); return; }
    startWallDrag(idx, evt);
  } else {
    ui.selectedOpeningId = null; ui.selectedLabelId = null; ui.selectedInteriorId = null;
    updateInlinePanel(); refreshSvg();
  }
}

function startWallDrag(edgeIndex, evt){
  var lvl = currentLevel();
  var e0 = edges(lvl.vertices)[edgeIndex];
  var horizontal = e0.horizontal;
  var startVal = horizontal ? e0.v1.y : e0.v1.x;
  var startP = svgPoint(evt);

  // Freeze the opening-gap ratios on both affected walls at the start of this gesture (see
  // rackOpeningsOnWall) so they scale smoothly for the whole drag instead of drifting from
  // being re-derived off already-snapped positions on every intermediate step.
  var keys = adjacentEdgeKeys(lvl.vertices, edgeIndex);
  var gapBaseline = {};
  var b1 = computeGapBaseline(lvl, keys.prevEdgeKey); if(b1) gapBaseline[keys.prevEdgeKey] = b1;
  var b2 = computeGapBaseline(lvl, keys.nextEdgeKey); if(b2) gapBaseline[keys.nextEdgeKey] = b2;

  function onMove(ev){
    var p = svgPoint(ev);
    var e = edges(currentLevel().vertices)[edgeIndex];
    var delta = horizontal ? (p.y-startP.y) : (p.x-startP.x);
    var target = startVal + delta;
    var cur = horizontal ? e.v1.y : e.v1.x;
    pushWall(edgeIndex, target-cur, gapBaseline);
    refreshSvg();
  }
  function onUp(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    activeDragCleanup = null;
    scheduleSave();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  activeDragCleanup = onUp;
}

// Interior reference lines/rectangles: sized once at placement via drag, then movable
// but never resizable - delete and redraw if the shape itself needs to change.
function startInteriorDraw(mode, startP){
  var kind = mode==='addInteriorRect' ? 'rect' : 'line';
  var s = {x:snap(startP.x), y:snap(startP.y)};
  ui.drawPreview = {kind:kind, x1:s.x, y1:s.y, x2:s.x, y2:s.y};
  refreshSvg();

  function onMove(ev){
    var p = svgPoint(ev);
    ui.drawPreview.x2 = snap(p.x);
    ui.drawPreview.y2 = snap(p.y);
    refreshSvg();
  }
  function onUp(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    activeDragCleanup = null;
    finalizeInteriorDraw();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  activeDragCleanup = onUp;
}

function finalizeInteriorDraw(){
  var prev = ui.drawPreview;
  ui.drawPreview = null;
  if(!prev){ refreshSvg(); return; }
  var lvl = currentLevel();
  var MIN_LEN = 20;

  if(prev.kind==='line'){
    var c1 = clampPointToPolygon({x:prev.x1,y:prev.y1}, lvl.vertices);
    var c2 = clampPointToPolygon({x:prev.x2,y:prev.y2}, lvl.vertices);
    var nx1=snap(c1.x), ny1=snap(c1.y), nx2=snap(c2.x), ny2=snap(c2.y);
    if(dist({x:nx1,y:ny1},{x:nx2,y:ny2}) < MIN_LEN){
      toast('Too small to place there');
      refreshSvg(); return;
    }
    lvl.interiorLines = lvl.interiorLines || [];
    lvl.interiorLines.push({id:nextId(), kind:'line', x1:nx1, y1:ny1, x2:nx2, y2:ny2});
  } else {
    // Clamp all 4 corners individually, then rebuild a clean axis-aligned rectangle from
    // their bounding box - this way a corner or edge overshooting a nearby wall gets pulled
    // straight back onto it rather than distorting the shape.
    var corners = [{x:prev.x1,y:prev.y1},{x:prev.x2,y:prev.y1},{x:prev.x2,y:prev.y2},{x:prev.x1,y:prev.y2}]
      .map(function(c){ return clampPointToPolygon(c, lvl.vertices); });
    var xs = corners.map(function(c){return c.x;}), ys = corners.map(function(c){return c.y;});
    var nx1=snap(Math.min.apply(null,xs)), nx2=snap(Math.max.apply(null,xs));
    var ny1=snap(Math.min.apply(null,ys)), ny2=snap(Math.max.apply(null,ys));
    if((nx2-nx1) < MIN_LEN || (ny2-ny1) < MIN_LEN){
      toast('Too small to place there');
      refreshSvg(); return;
    }
    lvl.interiorLines = lvl.interiorLines || [];
    lvl.interiorLines.push({id:nextId(), kind:'rect', x1:nx1, y1:ny1, x2:nx2, y2:ny2});
  }
  // Stay in this mode so several lines/rectangles can be drawn in a row, matching windows/doors.
  refreshSvg(); buildScheduleIfActive(); scheduleSave();
}

function startInteriorMoveDrag(id, evt){
  var startP = svgPoint(evt);
  var lvl = currentLevel();
  var il = (lvl.interiorLines||[]).find(function(x){ return x.id===id; });
  if(!il) return;
  var orig = {x1:il.x1, y1:il.y1, x2:il.x2, y2:il.y2};

  function onMove(ev){
    var p = svgPoint(ev);
    var dx = snap(p.x-startP.x), dy = snap(p.y-startP.y);
    var verts = currentLevel().vertices;
    // Same buffer-and-clamp behavior as placing a new one: dragging slightly past the
    // exterior wall is fine, it just gets pulled back onto the boundary as it moves.
    if(il.kind==='rect'){
      var corners = [
        {x:orig.x1+dx,y:orig.y1+dy}, {x:orig.x2+dx,y:orig.y1+dy},
        {x:orig.x2+dx,y:orig.y2+dy}, {x:orig.x1+dx,y:orig.y2+dy}
      ].map(function(c){ return clampPointToPolygon(c, verts); });
      var xs = corners.map(function(c){return c.x;}), ys = corners.map(function(c){return c.y;});
      il.x1 = snap(Math.min.apply(null,xs)); il.x2 = snap(Math.max.apply(null,xs));
      il.y1 = snap(Math.min.apply(null,ys)); il.y2 = snap(Math.max.apply(null,ys));
    } else {
      var c1 = clampPointToPolygon({x:orig.x1+dx, y:orig.y1+dy}, verts);
      var c2 = clampPointToPolygon({x:orig.x2+dx, y:orig.y2+dy}, verts);
      il.x1 = snap(c1.x); il.y1 = snap(c1.y); il.x2 = snap(c2.x); il.y2 = snap(c2.y);
    }
    refreshSvg();
  }
  function onUp(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    activeDragCleanup = null;
    updateInlinePanel();
    refreshSvg(); // reflects the focus-zoom updateInlinePanel() may have just applied
    scheduleSave();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  activeDragCleanup = onUp;
}

function deleteInteriorItem(id){
  var lvl = currentLevel();
  lvl.interiorLines = (lvl.interiorLines||[]).filter(function(x){ return x.id!==id; });
  if(ui.selectedInteriorId===id) ui.selectedInteriorId = null;
  refreshSvg(); updateInlinePanel(); scheduleSave();
}

function startLabelMoveDrag(id, evt){
  var startP = svgPoint(evt);
  var lvl = currentLevel();
  var lab = (lvl.labels||[]).find(function(x){ return x.id===id; });
  if(!lab) return;
  var startX = lab.x, startY = lab.y;

  function onMove(ev){
    var p = svgPoint(ev);
    lab.x = snap(startX + (p.x-startP.x));
    lab.y = snap(startY + (p.y-startP.y));
    refreshSvg();
  }
  function onUp(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    activeDragCleanup = null;
    updateInlinePanel();
    refreshSvg(); // reflects the focus-zoom updateInlinePanel() may have just applied
    scheduleSave();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  activeDragCleanup = onUp;
}

function startOpeningMoveDrag(id, evt){
  var startP = svgPoint(evt);
  var lvl = currentLevel();
  var o = lvl.openings.find(function(x){ return x.id===id; });
  if(!o) return;

  if(lvl.locks && lvl.locks.openings){
    var warned = false;
    function onLockedMove(){ if(!warned){ warned = true; toast('Doors/Windows are locked on this level'); } }
    function onLockedUp(){
      window.removeEventListener('pointermove', onLockedMove);
      window.removeEventListener('pointerup', onLockedUp);
      activeDragCleanup = null;
      updateInlinePanel();
      refreshSvg();
    }
    window.addEventListener('pointermove', onLockedMove);
    window.addEventListener('pointerup', onLockedUp);
    activeDragCleanup = onLockedUp;
    return;
  }

  var group = o.pairId ? lvl.openings.filter(function(x){ return x.pairId===o.pairId; }) : [o];
  var startOffsets = {}; group.forEach(function(m){ startOffsets[m.id] = m.offset; });
  var startOffset = o.offset;
  var lastClient = {x:evt.clientX, y:evt.clientY};

  function applyAt(clientX, clientY){
    var e = edges(currentLevel().vertices).find(function(x){ return x.key===o.wallKey; });
    if(!e) return;
    var p = svgPoint({clientX:clientX, clientY:clientY});
    var ux=(e.v2.x-e.v1.x)/e.len, uy=(e.v2.y-e.v1.y)/e.len;
    var deltaAlong = (p.x-startP.x)*ux + (p.y-startP.y)*uy;
    var desiredDelta = snap(startOffset + deltaAlong) - startOffset;
    var minStart = Math.min.apply(null, group.map(function(m){ return startOffsets[m.id]; }));
    var maxEnd = Math.max.apply(null, group.map(function(m){ return startOffsets[m.id]+m.width; }));
    var clampedDelta = Math.max(-minStart, Math.min(e.len-maxEnd, desiredDelta));
    group.forEach(function(m){ m.offset = startOffsets[m.id] + clampedDelta; });
    refreshSvg();
  }
  function onMove(ev){
    lastClient = {x:ev.clientX, y:ev.clientY};
    updateEdgePanPoint(lastClient.x, lastClient.y);
    applyAt(lastClient.x, lastClient.y);
  }
  function onUp(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    activeDragCleanup = null;
    stopEdgePan();
    updateInlinePanel();
    refreshSvg(); // reflects the focus-zoom updateInlinePanel() may have just applied
    buildScheduleIfActive();
    scheduleSave();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  activeDragCleanup = onUp;
  startEdgePan(function(){ applyAt(lastClient.x, lastClient.y); });
}

function startHandleDrag(id, end){
  var lvl = currentLevel();
  var o = lvl.openings.find(function(x){ return x.id===id; });
  if(!o) return;
  ui.selectedOpeningId = id;

  if(lvl.locks && lvl.locks.openings){
    var warned2 = false;
    function onLockedMove2(){ if(!warned2){ warned2 = true; toast('Doors/Windows are locked on this level'); } }
    function onLockedUp2(){
      window.removeEventListener('pointermove', onLockedMove2);
      window.removeEventListener('pointerup', onLockedUp2);
      activeDragCleanup = null;
    }
    window.addEventListener('pointermove', onLockedMove2);
    window.addEventListener('pointerup', onLockedUp2);
    activeDragCleanup = onLockedUp2;
    return;
  }

  var lastClient = null;

  function applyAt(clientX, clientY){
    var e = edges(currentLevel().vertices).find(function(x){ return x.key===o.wallKey; });
    if(!e) return;
    var p = svgPoint({clientX:clientX, clientY:clientY});
    var along = closestPointParam(e, p);
    if(end==='start'){
      var newOffset = Math.max(0, snap(Math.min(along, o.offset+o.width-MIN_OPENING_W)));
      var newWidth = (o.offset+o.width) - newOffset;
      o.offset = newOffset; o.width = newWidth;
    } else {
      var newEnd = Math.min(e.len, snap(Math.max(along, o.offset+MIN_OPENING_W)));
      o.width = newEnd - o.offset;
    }
    refreshSvg();
  }
  function onMove(ev){
    lastClient = {x:ev.clientX, y:ev.clientY};
    updateEdgePanPoint(lastClient.x, lastClient.y);
    applyAt(lastClient.x, lastClient.y);
  }
  function onUp(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    activeDragCleanup = null;
    stopEdgePan();
    buildScheduleIfActive();
    scheduleSave();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  activeDragCleanup = onUp;
  startEdgePan(function(){ if(lastClient) applyAt(lastClient.x, lastClient.y); });
}

/* ============================== LEVELS ============================== */
function populateLevelSelect(){
  var sel = document.getElementById('levelSelect');
  while(sel.firstChild) sel.removeChild(sel.firstChild);
  state.levels.forEach(function(lvl, i){
    var opt = document.createElement('option');
    opt.value = i; opt.textContent = lvl.name;
    sel.appendChild(opt);
  });
  sel.value = state.activeLevelIndex;
}

/* ============================== EXPORT / IMPORT ============================== */
function safeFileBase(){
  return (state.title||'floorplan').trim().replace(/[^a-z0-9\-_ ]/gi,'').replace(/\s+/g,'-').toLowerCase() || 'floorplan';
}

function exportJson(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = safeFileBase()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('File saved');
}

function csvEscape(val){
  val = String(val==null ? '' : val);
  if(/[",\n\r]/.test(val)){ val = '"'+val.replace(/"/g,'""')+'"'; }
  return val;
}

function csvCellValue(o, c){
  var v = o.cells && o.cells[c.key];
  if(c.kind==='checkbox') return v ? 'Yes' : 'No';
  return v || '';
}

function exportCsv(){
  var cols = allColumnsForDisplay();
  var header = ['Level'].concat(cols.map(function(c){ return c.label; }));
  var lines = [header.map(csvEscape).join(',')];
  state.levels.forEach(function(lvl){
    sortedOpenings(lvl.openings).forEach(function(o){
      var row = [lvl.name].concat(cols.map(function(c){ return csvCellValue(o, c); }));
      lines.push(row.map(csvEscape).join(','));
    });
  });
  var csvContent = lines.join('\r\n');
  var blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  showFileReadyDialog(blob, safeFileBase()+'.csv', 'text/csv', {
    title: 'CSV ready',
    successMsg: 'CSV shared',
    downloadLabel: 'CSV'
  });
}

function shareJson(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  showFileReadyDialog(blob, safeFileBase()+'.json', 'application/json', {
    title: 'Share this plan',
    successMsg: 'Shared',
    downloadLabel: 'File'
  });
}

function importJsonFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      applyLoadedState(JSON.parse(reader.result));
      ui.selectedOpeningId = null;
      populateLevelSelect();
      refreshSvg(); buildSchedule(); updateTitleField(); updateInlinePanel();
      scheduleSave();
      toast('File loaded');
    }catch(e){
      toast('Could not read that file');
    }
  };
  reader.readAsText(file);
}

function updateTitleField(){
  document.getElementById('title').textContent = state.title || 'Untitled Floor Plan';
  updateAddressDisplays();
}

function updateAddressDisplays(){
  var has = !!(state.address && state.address.trim());
  var floatEl = document.getElementById('planAddressFloat');
  var schedEl = document.getElementById('scheduleAddress');
  floatEl.textContent = state.address || '';
  floatEl.classList.toggle('show', has);
  schedEl.textContent = state.address || '';
  schedEl.classList.toggle('show', has);
}

function editAddress(){
  showPromptDialog({
    title: 'Address', defaultValue: state.address || '', placeholder: 'Address (optional)', okLabel: 'Save',
    onSubmit: function(val){
      state.address = (val || '').trim();
      updateAddressDisplays();
      scheduleSave();
    }
  });
}

var JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
var jsPdfLoadPromise = null;
function ensureJsPdf(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve(true);
  if(jsPdfLoadPromise) return jsPdfLoadPromise;
  jsPdfLoadPromise = new Promise(function(resolve){
    var s = document.createElement('script');
    s.src = JSPDF_URL;
    s.onload = function(){ resolve(!!(window.jspdf && window.jspdf.jsPDF)); };
    s.onerror = function(){ resolve(false); };
    document.head.appendChild(s);
    setTimeout(function(){ resolve(!!(window.jspdf && window.jspdf.jsPDF)); }, 7000);
  });
  return jsPdfLoadPromise;
}

// Rasterize one level's plan to a PNG. The SVG uses CSS custom properties (var(--wall) etc.)
// for its colors; those only resolve against the *page's* stylesheet, not a detached/serialized
// copy, so we inject a self-contained <style> defining the same variables before serializing.
// Resizes/compresses a captured photo so files stay small and manageable to share -
// full-resolution phone photos are unnecessarily large for a schedule thumbnail or a PDF.
function resizeImageFile(file, maxDim, quality, callback){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      var ratio = Math.min(1, maxDim/Math.max(w,h));
      var cw = Math.max(1, Math.round(w*ratio)), ch = Math.max(1, Math.round(h*ratio));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ callback(null); };
    img.src = reader.result;
  };
  reader.onerror = function(){ callback(null); };
  reader.readAsDataURL(file);
}

function svgToPngDataUrl(lvl, scale){
  return new Promise(function(resolve){
    var svgElTmp = document.createElementNS(svgNS,'svg');
    svgElTmp.setAttribute('xmlns', svgNS);
    buildSvg(svgElTmp, lvl, {printMode:true});
    var styleTag = document.createElementNS(svgNS,'style');
    styleTag.textContent = ':root{--wall:#20242c;--paper:#ffffff;--accent:#ff5a1f;--window:#0e6fc4;--door:#8a5a2b;--line:#d8d3c4;--panel:#f6f4ee;--muted:#4b5058;--danger:#c62828;}';
    svgElTmp.insertBefore(styleTag, svgElTmp.firstChild);
    var vb = svgElTmp.getAttribute('viewBox').split(' ').map(Number);
    var w = vb[2], h = vb[3];
    svgElTmp.setAttribute('width', w); svgElTmp.setAttribute('height', h);
    var xml = new XMLSerializer().serializeToString(svgElTmp);
    var svg64 = btoa(unescape(encodeURIComponent(xml)));
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(w*scale));
      canvas.height = Math.max(1, Math.round(h*scale));
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve({dataUrl:canvas.toDataURL('image/jpeg', 0.85), w:w, h:h});
    };
    img.onerror = function(){ resolve(null); };
    img.src = 'data:image/svg+xml;base64,'+svg64;
  });
}

// Presents an explicit choice rather than silently guessing which delivery method will work -
// the automatic fallback chain wasn't landing predictably inside this embedded environment,
// so the person picks Share (native OS share sheet) or Download themselves.
function showFileReadyDialog(blob, filename, mimeType, opts){
  opts = opts || {};
  closeDialog();
  var ov = document.createElement('div'); ov.id='dialogOverlay';
  var card = document.createElement('div'); card.id='dialogCard';
  var h3 = document.createElement('h3'); h3.textContent = opts.title || 'File ready';
  var p = document.createElement('p'); p.textContent = filename;
  var btns = document.createElement('div'); btns.id='dialogButtons';
  btns.style.flexDirection = 'column';

  // A real download is the reliable path here - opening the PDF via a blob: URL in a new tab
  // gave a degraded, single-page-only preview in this embedded environment, so we skip that
  // entirely now and go straight to a genuine file download instead.
  var downloadBtn = document.createElement('button');
  downloadBtn.className='dialogOkBtn'; downloadBtn.textContent='Download '+(opts.downloadLabel || 'File');
  downloadBtn.addEventListener('click', function(){ closeDialog(); fallbackDeliverFile(blob, filename); });

  var shareBtn = document.createElement('button');
  shareBtn.className='dialogCancelBtn'; shareBtn.textContent='Try in-app Share…';
  shareBtn.addEventListener('click', function(){ closeDialog(); attemptShare(blob, filename, mimeType, opts); });

  btns.appendChild(downloadBtn); btns.appendChild(shareBtn);
  card.appendChild(h3); card.appendChild(p); card.appendChild(btns);
  ov.appendChild(card);
  ov.addEventListener('click', function(ev){ if(ev.target===ov) closeDialog(); });
  document.body.appendChild(ov);
}

function attemptShare(blob, filename, mimeType, opts){
  var file = null;
  try{ file = new File([blob], filename, {type:mimeType}); }catch(e){}
  if(file && navigator.share){
    navigator.share({files:[file], title: opts.title || filename})
      .then(function(){ toast(opts.successMsg || 'Shared'); })
      .catch(function(err){
        if(err && err.name==='AbortError') return; // person backed out of the share sheet, not an error
        toast('Not supported here \u2014 use Open / Download instead');
      });
  } else {
    toast('Not supported in this browser \u2014 use Open / Download instead');
  }
}

function fallbackDeliverFile(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
  toast('Downloaded \u2014 open it from Files (or your Downloads folder) to see every page, including the schedule');
}

// A simple tappable list of actions (File menu, Options menu) using the same dialog chrome
// as the confirm/prompt dialogs, rather than introducing a whole new UI pattern.
function showMenuDialog(title, items){
  closeDialog();
  var ov = document.createElement('div'); ov.id='dialogOverlay';
  var card = document.createElement('div'); card.id='dialogCard';
  var h3 = document.createElement('h3'); h3.textContent = title;
  card.appendChild(h3);
  items.forEach(function(item){
    var btn = document.createElement('button');
    btn.type='button'; btn.className = 'ipActionBtn' + (item.danger ? ' ipDangerBtn' : ''); btn.style.width='100%'; btn.style.marginBottom='8px';
    btn.textContent = item.label;
    btn.addEventListener('click', function(){ closeDialog(); item.onClick(); });
    card.appendChild(btn);
  });
  var cancelBtn = document.createElement('button');
  cancelBtn.type='button'; cancelBtn.className='dialogCancelBtn'; cancelBtn.style.width='100%';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', closeDialog);
  card.appendChild(cancelBtn);
  ov.appendChild(card);
  ov.addEventListener('click', function(ev){ if(ev.target===ov) closeDialog(); });
  document.body.appendChild(ov);
}

// Every new plan requires a real name up front, instead of silently defaulting to "Untitled

  var listWrap = document.createElement('div');
  var loadingMsg = document.createElement('p'); loadingMsg.textContent='Loading plans…';
  listWrap.appendChild(loadingMsg);
  card.appendChild(listWrap);

  var allPlans = [];
  function renderList(){
    listWrap.innerHTML = '';
    var showArchived = archiveToggle.checked;
    var q = searchInput.value.trim().toLowerCase();
    var filtered = allPlans.filter(function(p){
      var matchesArchived = showArchived ? !!p.archived : !p.archived;
      var matchesQ = !q || (p.jobName||'').toLowerCase().indexOf(q)>=0 || (p.address||'').toLowerCase().indexOf(q)>=0;

      row.style.cssText='display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); gap:8px;';
      var info = document.createElement('div');
      info.style.cssText='flex:1; min-width:0; cursor:pointer;';
      var nameEl = document.createElement('div'); nameEl.style.cssText='font-weight:800; font-size:14.5px;';
      nameEl.textContent = p.jobName || 'Untitled Floor Plan';
      var metaEl = document.createElement('div'); metaEl.style.cssText='font-size:12px; color:#777; margin-top:2px;';
      var when = p.lastEditedAt ? new Date(p.lastEditedAt).toLocaleString() : '';
      var metaBits = [p.address, when, p.lastEditedBy].filter(Boolean);
      metaEl.textContent = metaBits.join(' · ');
      // No status badge here - active vs. archived (governed by the toggle above) is the
      // only state that matters at a glance in this list.
      info.appendChild(nameEl); info.appendChild(metaEl);
      info.addEventListener('click', function(){
        closeDialog();

      });
      var actionBtn = document.createElement('button');

      actionBtn.textContent = showArchived ? 'Restore' : 'Archive';
      actionBtn.style.cssText='flex:0 0 auto; font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:8px; border:2px solid var(--ink); background:var(--paper);';
      actionBtn.addEventListener('click', function(ev){

          .then(function(res){ if(!res.ok) throw new Error(); return res.json(); })
          .then(function(){
            toast(nextArchived ? 'Archived' : 'Restored');

      row.appendChild(info); row.appendChild(actionBtn);
      listWrap.appendChild(row);
    });

  apiFetch('/plans').then(function(res){

    else { toast('Could not reach PDF library - trying print instead'); exportPdfViaPrint(); }
  });

function generateRealPdf(){
  var jsPDFCtor = window.jspdf.jsPDF;
  var doc = new jsPDFCtor({unit:'pt', format:'letter'});
  var pageW = doc.internal.pageSize.getWidth();
  var pageH = doc.internal.pageSize.getHeight();
  var margin = 40;

  // Logo sits top-right - the title/address block is left-aligned and never reaches the
  // right side of the page, so the logo has clear room there without competing with it.
  var LOGO_W = 96, LOGO_H = LOGO_W / COMPANY_LOGO_ASPECT;
  var TITLE_SIZE = 16;
  // doc.text()'s y is the text BASELINE, not its visual top - the glyphs themselves extend
  // upward from there by roughly the font's cap-height. Shifting the logo up by that amount
  // lines its top edge up with the top of the title text instead of sitting a bit low.
  var TITLE_CAP_OFFSET = TITLE_SIZE * 0.72;

  // Same header block on every page: logo, title, address, date, then a page-specific
  // label (the level name, or "Window Schedule"). Returns the y to start content at.
  function drawPdfPageHeader(pageLabel){
    try{ doc.addImage(COMPANY_LOGO_DATA_URL, 'PNG', pageW-margin-LOGO_W, margin-TITLE_CAP_OFFSET, LOGO_W, LOGO_H); }catch(e){}

    var y = margin;
    doc.setFont('helvetica','bold'); doc.setFontSize(TITLE_SIZE);
    doc.text(state.title || 'Untitled Floor Plan', margin, y);
    y += 18;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    if(state.address && state.address.trim()){
      doc.text(state.address, margin, y); y += 14;
    }
    doc.setTextColor(90,90,90);
    doc.text('Floor plan (not to scale) \u00b7 '+new Date().toLocaleDateString(), margin, y);
    doc.setTextColor(20,23,28);
    y += 20;

    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text(pageLabel, margin, y);
    y += 16;

    return Math.max(y, margin - TITLE_CAP_OFFSET + LOGO_H + 10);
  }

  Promise.all(state.levels.map(function(lvl){ return svgToPngDataUrl(lvl, 1.5); }))
  .then(function(images){
    // Levels flow onto the same page when there's room, instead of forcing a page break for
    // every one - only starts a fresh page when there isn't reasonable space left for the
    // next level's plan. A level that continues on the same page as the previous one just
    // gets its name as a small heading, not the full logo/title/address/date block again.
    var MIN_IMG_H = 120;
    var y = null;
    state.levels.forEach(function(lvl, i){
      var img = images[i];
      if(y===null){
        y = drawPdfPageHeader(lvl.name);
      } else if(pageH - margin - y < MIN_IMG_H + 30){
        doc.addPage();
        y = drawPdfPageHeader(lvl.name);
      } else {
        y += 14;
        doc.setFont('helvetica','bold'); doc.setFontSize(13);
        doc.text(lvl.name, margin, y);
        y += 16;
      }

      if(img){
        var maxW = pageW - margin*2;
        var maxH = pageH - margin - y;
        var ratio = Math.min(maxW/img.w, maxH/img.h);
        doc.addImage(img.dataUrl, 'JPEG', margin, y, img.w*ratio, img.h*ratio);
        y += img.h*ratio;
      }
    });

    doc.addPage();
    var yy = drawPdfPageHeader('Window Schedule');

    // colsMeta[0] is the synthetic Level column; the rest mirror allColumnsForDisplay().
    var colsMeta = [{key:'__level', label:'Level', kind:'text'}].concat(allColumnsForDisplay().map(function(c){
      return {key:c.key, label:(c.pdfLabel||c.label), kind:c.kind};
    }));
    var textAreaW = pageW - margin*2;
    var colW = textAreaW / colsMeta.length;
    var rowH = 22;
    var CHK_SIZE = 8;

    function drawRow(colsMeta, values, bold, noWork){
      doc.setFont('helvetica', bold?'bold':'normal');
      doc.setFontSize(8);
      if(noWork){
        doc.setFillColor(246,244,238); // matches --panel
        doc.rect(margin, yy, pageW-margin*2, rowH-3, 'F');
        doc.setTextColor(75,80,88); // matches --muted
      }
      var x = margin;
      colsMeta.forEach(function(c, i){
        if(c.kind==='checkbox' && !bold){
          var cx = x+colW/2-CHK_SIZE/2, cy = yy+(rowH-3)/2-CHK_SIZE/2;
          doc.setDrawColor(noWork?150:120,noWork?150:120,noWork?150:120);
          if(values[i]){
            doc.setFillColor(noWork?120:40, noWork?120:40, noWork?120:40);
            doc.rect(cx, cy, CHK_SIZE, CHK_SIZE, 'FD');
          } else {
            doc.rect(cx, cy, CHK_SIZE, CHK_SIZE, 'D');
          }
        } else {
          var lines = doc.splitTextToSize(String(values[i]||''), colW-6);
          doc.text(lines[0]||'', x+3, yy+13);
        }
        x += colW;
      });
      if(noWork){ doc.setTextColor(20,23,28); }
      doc.setDrawColor(200,200,200);
      doc.line(margin, yy+rowH-3, pageW-margin, yy+rowH-3);
      yy += rowH;
      if(yy > pageH - margin){ doc.addPage(); yy = drawPdfPageHeader('Window Schedule'); }
    }

    drawRow(colsMeta, colsMeta.map(function(c){ return c.label; }), true, false);
    state.levels.forEach(function(lvl){
      sortedOpenings(lvl.openings).forEach(function(o){
        var values = colsMeta.map(function(c){
          if(c.key==='__level') return lvl.name;
          if(c.kind==='checkbox') return !!(o.cells && o.cells[c.key]);
          return (o.cells && o.cells[c.key]) || '';
        });
        drawRow(colsMeta, values, false, !!o.noWork);
      });
    });

    var pdfBlob = doc.output('blob');
    showFileReadyDialog(pdfBlob, safeFileBase()+'.pdf', 'application/pdf', {
      title: 'PDF ready',
      successMsg: 'PDF shared',
      downloadLabel: 'PDF'
    });
  })
  .catch(function(){
    toast('Could not build the PDF - trying print instead');
    exportPdfViaPrint();
  });
}

// Fallback only: relies on window.print(), which is useful once this app runs as an installed
// PWA outside any sandbox, but may be silently blocked inside the current artifact environment.
function exportPdfViaPrint(){
  var area = document.getElementById('printArea');
  while(area.firstChild) area.removeChild(area.firstChild);

  var h1 = document.createElement('h1'); h1.textContent = state.title || 'Untitled Floor Plan';
  area.appendChild(h1);
  if(state.address && state.address.trim()){
    var addr = document.createElement('div'); addr.className='paddr'; addr.textContent = state.address;
    area.appendChild(addr);
  }
  var sub = document.createElement('div'); sub.className='psub';
  sub.textContent = 'Floor plan (not to scale) · '+ new Date().toLocaleDateString();
  area.appendChild(sub);

  state.levels.forEach(function(lvl){
    var wrap = document.createElement('div'); wrap.className='plevel';
    var h2 = document.createElement('h2'); h2.textContent = lvl.name;
    wrap.appendChild(h2);
    var svgClone = document.createElementNS(svgNS,'svg');
    svgClone.setAttribute('xmlns', svgNS);
    buildSvg(svgClone, lvl, {printMode:true});
    wrap.appendChild(svgClone);
    area.appendChild(wrap);
  });

  var table = document.createElement('table');
  var thead = document.createElement('thead'); var htr=document.createElement('tr');
  var thLevel = document.createElement('th'); thLevel.textContent='Level'; htr.appendChild(thLevel);
  allColumnsForDisplay().forEach(function(c){ var th=document.createElement('th'); th.textContent=c.label; htr.appendChild(th); });
  thead.appendChild(htr); table.appendChild(thead);
  var tbody = document.createElement('tbody');
  state.levels.forEach(function(lvl){
    sortedOpenings(lvl.openings).forEach(function(o){
      var tr = document.createElement('tr');
      if(o.noWork) tr.className = 'rowNoWork';
      var tdL = document.createElement('td'); tdL.textContent = lvl.name; tr.appendChild(tdL);
      allColumnsForDisplay().forEach(function(c){
        var td = document.createElement('td');
        var v = o.cells && o.cells[c.key];
        td.textContent = c.kind==='checkbox' ? (v ? '\u2713' : '') : (v || '');
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  area.appendChild(table);

  requestAnimationFrame(function(){ window.print(); });
}

/* ============================== WIRE UP ============================== */
function wireUp(){
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){ switchTab(t.dataset.tab); });
  });
  var suppressNextWindowClick = false;
  document.querySelectorAll('.tbtn[data-mode]').forEach(function(b){
    b.addEventListener('click', function(){
      if(suppressNextWindowClick){ suppressNextWindowClick = false; return; }
      if(ui.mode===b.dataset.mode && b.dataset.mode!=='move'){ setMode('move'); }
      else { setMode(b.dataset.mode); }
    });
  });

  function updateWindowDefaultBadge(){
    var badge = document.getElementById('windowDefaultBadge');
    if(!badge) return;
    var op = state.defaultWindowOperation || 'Double Hung';
    badge.textContent = op==='Double Hung' ? 'DH' : (op==='Casement' ? 'CSMT' : 'FIX');
  }
  window.updateWindowDefaultBadge = updateWindowDefaultBadge;

  function setDefaultWindowOperation(op){
    state.defaultWindowOperation = op;
    updateWindowDefaultBadge();
    scheduleSave();
    toast('New windows will default to '+op);
  }
  function showWindowDefaultPicker(){
    showMenuDialog('Default window style', [
      { label: 'Double Hung', onClick: function(){ setDefaultWindowOperation('Double Hung'); } },
      { label: 'Casement', onClick: function(){ setDefaultWindowOperation('Casement'); } },
      { label: 'Fixed', onClick: function(){ setDefaultWindowOperation('Fixed'); } }
    ]);
  }
  updateWindowDefaultBadge();

  var addWindowBtn = document.getElementById('addWindowBtn');
  var pressTimer = null;
  addWindowBtn.addEventListener('pointerdown', function(){
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function(){
      suppressNextWindowClick = true;
      showWindowDefaultPicker();
    }, 550);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(evtName){
    addWindowBtn.addEventListener(evtName, function(){ clearTimeout(pressTimer); });
  });
  addWindowBtn.addEventListener('dblclick', function(ev){ ev.preventDefault(); showWindowDefaultPicker(); });

  function showLabelToolMenu(){
    showMenuDialog('Add to plan', [
      { label: 'Room Label', onClick: function(){ setMode('addLabel'); } },
      { label: 'Interior Line', onClick: function(){ setMode('addInteriorLine'); toast('Drag on the plan to draw a line'); } },
      { label: 'Interior Rectangle', onClick: function(){ setMode('addInteriorRect'); toast('Drag on the plan to draw a rectangle'); } }
    ]);
  }
  var addLabelBtn = document.getElementById('addLabelBtn');
  var labelPressTimer = null;
  addLabelBtn.addEventListener('pointerdown', function(){
    clearTimeout(labelPressTimer);
    labelPressTimer = setTimeout(function(){
      suppressNextWindowClick = true;
      showLabelToolMenu();
    }, 550);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(evtName){
    addLabelBtn.addEventListener(evtName, function(){ clearTimeout(labelPressTimer); });
  });
  addLabelBtn.addEventListener('dblclick', function(ev){ ev.preventDefault(); showLabelToolMenu(); });

  document.getElementById('zoomInBtn').addEventListener('click', function(){
    var lvl = currentLevel();
    var bb = boundingBox(lvl.vertices);
    var pad = 70;
    var baseVw = (bb.maxX-bb.minX)+pad*2, baseVh = (bb.maxY-bb.minY)+pad*2;
    var vb = computeViewBox(lvl, false);
    var centerX = vb.vx + vb.vw/2, centerY = vb.vy + vb.vh/2;
    var newZoom = clampZoom(viewState.zoom*1.3);
    var vwNew = baseVw/newZoom, vhNew = baseVh/newZoom;
    viewState.zoom = newZoom;
    viewState.vx = centerX - vwNew/2;
    viewState.vy = centerY - vhNew/2;
    refreshSvg();
  });
  document.getElementById('zoomOutBtn').addEventListener('click', function(){
    var lvl = currentLevel();
    var bb = boundingBox(lvl.vertices);
    var pad = 70;
    var baseVw = (bb.maxX-bb.minX)+pad*2, baseVh = (bb.maxY-bb.minY)+pad*2;
    var vb = computeViewBox(lvl, false);
    var centerX = vb.vx + vb.vw/2, centerY = vb.vy + vb.vh/2;
    var newZoom = clampZoom(viewState.zoom/1.3);
    if(newZoom <= 1.001){ resetView(); refreshSvg(); return; }
    var vwNew = baseVw/newZoom, vhNew = baseVh/newZoom;
    viewState.zoom = newZoom;
    viewState.vx = centerX - vwNew/2;
    viewState.vy = centerY - vhNew/2;
    refreshSvg();
  });
  document.getElementById('zoomFitBtn').addEventListener('click', function(){
    resetView();
    refreshSvg();
  });

  function resetCurrentLevel(){
    var lvl = currentLevel();
    showConfirmDialog({
      title: 'Reset this level?',
      message: 'This clears "'+lvl.name+'"\'s plan and schedule rows. Other levels are not affected.',
      okLabel: 'Reset', danger: true,
      onConfirm: function(){
        lvl.vertices = defaultBox();
        lvl.openings = [];
        lvl.labels = [];
        resetView();
        setMode('move');
        refreshSvg(); buildScheduleIfActive(); scheduleSave();
      }
    });
  }

  function deleteCurrentLevel(){
    if(state.levels.length <= 1){
      toast('Can\'t delete the only level');
      return;
    }
    var lvl = currentLevel();
    showConfirmDialog({
      title: 'Delete this level?',
      message: 'This removes "'+lvl.name+'" and everything on it. Other levels are not affected.',
      okLabel: 'Delete', danger: true,
      onConfirm: function(){
        var idx = state.activeLevelIndex;
        state.levels = state.levels.filter(function(l){ return l.id !== lvl.id; });
        state.activeLevelIndex = Math.min(idx, state.levels.length-1);
        ui.selectedOpeningId = null; ui.selectedLabelId = null;
        resetView();
        setMode('move');
        populateLevelSelect();
        refreshSvg(); buildScheduleIfActive(); scheduleSave();
        toast('Level deleted');

      { label: 'Manage schedule columns', onClick: showColumnsDialog },
      { label: 'Lock "'+currentLevel().name+'"\u2026', onClick: showLockDialog },
      { label: 'Reset "'+currentLevel().name+'"', onClick: resetCurrentLevel, danger: true },
      { label: 'Delete "'+currentLevel().name+'"', onClick: deleteCurrentLevel, danger: true }
    ]);
  });
  // This button is only ever visible when signed in (see updateUserMenuButton) - the
  // signed-out state is Google's own rendered button in #googleSignInSlot instead.
  document.getElementById('userMenuBtn').addEventListener('click', function(){
    showMenuDialog('Signed in as ' + currentUserEmail, [
      { label: 'Sign out', onClick: signOutUser, danger: true }
    ]);
  });

  document.getElementById('unsyncedBanner').addEventListener('click', function(){
    if(isSignedIn()) syncToCloud();
    else requireSignInDialog('Sign in to sync your changes to the cloud.');
  });

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('title').addEventListener('input', function(){
    state.title = document.getElementById('title').textContent;
    scheduleSave();
  });
  document.getElementById('title').addEventListener('blur', function(){
    if(!state.title.trim()){ state.title='Untitled Floor Plan'; updateTitleField(); }
  });
  document.getElementById('planAddressFloat').addEventListener('click', editAddress);
  document.getElementById('scheduleAddress').addEventListener('click', editAddress);

  document.getElementById('levelSelect').addEventListener('change', function(ev){
    state.activeLevelIndex = parseInt(ev.target.value, 10);
    ui.selectedOpeningId = null;
    resetView();
    setMode('move');
    refreshSvg(); updateInlinePanel(); buildScheduleIfActive();
  });
  document.getElementById('addLevelBtn').addEventListener('click', function(){
    var suggested = 'Level '+(state.levels.length+1);
    showPromptDialog({
      title: 'Name this level', defaultValue: suggested, okLabel: 'Add',
      onSubmit: function(name){
        state.levels.push(makeLevel((name||'').trim() || suggested));
        state.activeLevelIndex = state.levels.length-1;
        populateLevelSelect();
        ui.selectedOpeningId = null;
        setMode('move');
        refreshSvg(); buildScheduleIfActive(); scheduleSave();
        toast('Level added');
      }
    });
  });
  document.getElementById('renameLevelBtn').addEventListener('click', function(){
    var lvl = currentLevel();
    showPromptDialog({
      title: 'Rename level', defaultValue: lvl.name, okLabel: 'Save',
      onSubmit: function(name){
        if(!name || !name.trim()) return;
        lvl.name = name.trim();
        populateLevelSelect();
        buildScheduleIfActive();
        scheduleSave();
      }
    });
  });

  function doStartNew(name){
    // Flush whatever's pending for the plan we're leaving before switching state out from
    // under it - otherwise a fast tap right after an edit could drop that last edit on the
    // floor (the debounced save timer would fire later against the NEW, already-reset state).
    if(saveTimer){ clearTimeout(saveTimer); doSave(); }
    state.title = (name && name.trim()) ? name.trim() : 'Untitled Floor Plan';
    state.address = '';
    state.levels = [ makeLevel('Level 1') ];
    state.activeLevelIndex = 0;
    state.defaultWindowOperation = 'Double Hung';
    // A brand new plan gets its own cloud identity immediately, so it never accidentally
    // overwrites whatever plan was open before.
    state.planId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('p'+Date.now()+Math.random().toString(36).slice(2));
    state.status = 'Draft';
    state.lastEditedAt = null;
    // Don't let the OLD plan's unsynced-streak timestamp bleed into this new one - otherwise
    // the banner could fire based on how long ago the previous plan went stale, not this one.
    lastEditAt = null;
    lastSuccessfulSyncAt = null;
    unsyncedSinceAt = null;
    updateUnsyncedBanner();
    // columnVisibility and customColumns are intentionally preserved across projects.
    undoStack = [];
    updateUndoButton();
    ui.selectedOpeningId = null; ui.selectedLabelId = null;
    setMode('move');
    populateLevelSelect();
    updateTitleField();
    updateAddressDisplays();
    if(window.updateWindowDefaultBadge) window.updateWindowDefaultBadge();
    refreshSvg();
    buildScheduleIfActive();
    lastStableSnapshot = JSON.stringify(state);
    scheduleSave();
    toast('New plan started');
  }
  // doStartNew is declared in this closure (wireUp) but top-level code (HWR Plans dialog,
  // startNewPlanFlow) needs to call it directly - same pattern as updateWindowDefaultBadge
  // elsewhere in this file. New always goes straight to the name-prompt flow now, no
  // "save first?" gate: that confirmation only mattered when v1 had a single local save slot
  // where starting new could destroy your only copy. Every plan now has a permanent cloud
  // record (doStartNew flushes any pending save before switching), so it's redundant friction.
  window.doStartNew = doStartNew;

  document.getElementById('fileMenuBtn').addEventListener('click', function(){
    showMenuDialog('File', [
      { label: 'HWR Plans\u2026', onClick: showHwrPlansDialog },
      { label: 'New\u2026', onClick: startNewPlanFlow },
      { label: 'Export\u2026', onClick: function(){
          showMenuDialog('Export', [
            { label: 'PDF', onClick: exportPdf },
            { label: 'CSV', onClick: exportCsv }
          ]);
        }
      },
      { label: 'Share Link', onClick: shareCloudLink },
      { label: 'Address\u2026', onClick: editAddress }
    ]);
  });
  document.getElementById('photoInput').addEventListener('change', function(ev){
    var f = ev.target.files && ev.target.files[0];
    var openingId = pendingPhotoOpeningId, slot = pendingPhotoSlot;
    ev.target.value = '';
    if(!f || !openingId || !slot) return;
    resizeImageFile(f, 1440, 0.72, function(dataUrl){
      if(!dataUrl){ toast('Could not read that photo'); return; }
      var lvl = currentLevel();
      var o = lvl.openings.find(function(x){ return x.id===openingId; });
      if(!o) return;
      if(!o.photos) o.photos = {interior:null, exterior:null};
      o.photos[slot] = dataUrl;
      updateInlinePanel(); buildScheduleIfActive(); scheduleSave();
      uploadPhotoToCloud(o.id, slot, dataUrl); // instant local preview above; this makes it travel between devices
    });
  });

  initInteraction();
}

/* ============================== INIT ============================== */
function init(){
  wireUp();
  initGoogleAuth();
  // Read synchronously, before any async GIS sign-in callback can fire, so a shared link's
  // ?plan= id is captured in time even if the visitor isn't signed in yet.
  checkUrlForSharedPlan();
  loadState(function(){
    // Every plan needs a stable cloud identity from the moment it exists, even a fresh
    // blank one nobody has saved yet - guarantees the first cloud sync creates exactly
    // one record instead of leaving planId null.
    if(!state.planId){
      state.planId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('p'+Date.now()+Math.random().toString(36).slice(2));
    }
    updateTitleField();
    populateLevelSelect();
    refreshSvg();
    buildSchedule();
    setSaveIndicator('Saved');
    lastStableSnapshot = JSON.stringify(state);
    updateUndoButton();
    if(window.updateWindowDefaultBadge) window.updateWindowDefaultBadge();
    startPeriodicRefreshCheck();
    startUnsyncedBannerTimer();
  });
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
</body>
</html>
